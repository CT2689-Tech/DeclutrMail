          sum(sum by (status) (increase(logging_googleapis_com:user_ops_reconnect_incidents_sum{monitored_resource="cloud_run_revision",service_name="declutrmail-worker"}[15m])) / sum by (status) (increase(logging_googleapis_com:user_ops_reconnect_incidents_count{monitored_resource="cloud_run_revision",service_name="declutrmail-worker"}[15m]))) >= 2
