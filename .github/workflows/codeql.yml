name: CodeQL

# Why this file exists at all.
#
# CodeQL used to run as GitHub's managed `dynamic/github-code-scanning/
# codeql` workflow — "default setup". That worked fine until the merge
# queue was enabled on 2026-08-19.
#
# `Analyze (javascript-typescript)` is a REQUIRED status check on main.
# Default setup only ever fires on `push` to the default branch and on
# `refs/pull/N/head`; it never fires on `merge_group`, and being managed
# by GitHub it exposes no trigger list to edit. A required check that
# never reports does not fail the queue entry — it HANGS it, silently,
# until the 60-minute check-response timeout kicks it out. Canary #584
# was queued at 00:23:16Z and removed at 01:26:28Z having merged
# nothing, and with `enforce_admins: true` there was no bypass: main was
# frozen outright for every author including the founder.
#
# Advanced setup is the only way to give that analysis a `merge_group`
# trigger, so it moved into the repo. Everything here is deliberately
# shaped to match what default setup already produced, so that swapping
# one for the other changes no finding and no branch-protection setting.

on:
  # No `branches:` filter — see the note in ci.yml. A stacked PR (base is
  # another feature branch) would otherwise go unscanned entirely.
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # MERGE QUEUE — the reason this file exists. See the header.
  merge_group:
  # Default setup ran a weekly scan on repositories that had gone quiet.
  # Keeping it means the migration does not quietly drop a guarantee.
  schedule:
    - cron: '32 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a queue entry's analysis. A cancelled check reports
  # nothing, and "reports nothing" is precisely the hang this workflow
  # was written to fix — re-introducing it here would be circular. Same
  # guard, same reasoning as ci.yml.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    # This NAME is load-bearing. `Analyze (javascript-typescript)` is the
    # required status check on main, matched by branch protection as a
    # literal string, and it is the name default setup produced. Keeping
    # it identical is what lets this file replace default setup without
    # touching branch protection at all.
    #
    # Renaming it does not turn the gate red — it turns the gate OFF.
    # Protection waits for a context that never appears, and an absent
    # check is not a failure.
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Uploading the SARIF results is the point of the job.
      security-events: write
      # Lets CodeQL read workflow run metadata. Unnecessary while the
      # repo is public, required the moment it is not.
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          # One language, matching default setup. It listed `actions`,
          # `javascript` and `typescript` as available too, but only ever
          # emitted the single `Analyze (javascript-typescript)` check —
          # so analysing more here would add a check nobody requires and
          # change what the gate means.
          languages: javascript-typescript
          # JavaScript and TypeScript are analysed from source; there is
          # nothing to compile, so no autobuild step is needed.
          build-mode: none
          # `queries:` is deliberately absent. Default setup ran the
          # `default` suite; naming `security-extended` here would widen
          # the findings as a side effect of a plumbing change.

      - name: Analyse
        uses: github/codeql-action/analyze@v3
