name: Migration lint (Atlas)

on:
  # No `branches:` filter — see the note in ci.yml. `edited` is omitted
  # so a title/body tweak does not re-lint, and `ready_for_review` for
  # the same reason (un-drafting yields no new SHA; nothing here skips
  # drafts). Retarget by hand:
  # `gh workflow run migration-lint.yml --ref <branch>`.
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/db/migrations/**'
      - 'packages/db/src/schema/**'
      - 'packages/db/drizzle.config.ts'
      - 'packages/db/atlas.hcl'
      # The workflow and the Atlas it installs, so a change to either is
      # exercised before merge rather than on the next migration PR.
      - '.github/workflows/migration-lint.yml'
      - 'scripts/install-atlas.sh'
  # MERGE QUEUE — and this one is not bookkeeping. Two PRs can each add
  # migration `0063`, pass this lint independently, and merge cleanly as
  # text. The collision only exists in the combination, which is the one
  # state the queue tests and no pull request ever does. No `paths`
  # filter here: the queue's diff spans every entry ahead of it, so a
  # migration can arrive from a PR whose own files are elsewhere.
  merge_group:

  # Manual trigger fallback — PR #178 hit a case on 2026-06-10 where
  # pull_request silently did not dispatch despite base + branch matching
  # and no path/draft/concurrency exclusion. Lets the founder fire CI by
  # hand on a branch when needed.
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: atlas migrate lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enforce forward-only migration history
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed_existing="$(
            git diff --name-only --diff-filter=MDR "$BASE_SHA" -- \
              'packages/db/migrations/*.sql'
          )"
          if [ -n "$changed_existing" ]; then
            echo "::error::Applied migration files are immutable. Add a new forward migration instead."
            printf '%s\n' "$changed_existing"
            exit 1
          fi
          echo "✓ Existing forward migrations are unchanged."

      - name: Set up Atlas
        # Pinned community build, checksum-verified before it runs. Since
        # v0.38 the default build runs `migrate lint` only for paid Atlas Pro
        # users (https://atlasgo.io/blog-v038#change-in-v038-atlas-migrate-lint);
        # scripts/install-atlas.sh has the why and the bump procedure. Same
        # installer as migration-apply.yml.
        run: |
          ./scripts/install-atlas.sh "$RUNNER_TEMP/atlas"
          echo "$RUNNER_TEMP/atlas" >> "$GITHUB_PATH"

      - name: Run atlas migrate lint
        # Postgres 16 runs as a service container above (more reliable than
        # Atlas's `docker://` driver, which spawns its own container per run).
        # Atlas applies each migration against the empty `dev` DB and flags
        # dangerous operations per the top-level `lint` block in
        # packages/db/atlas.hcl. `--config` is what loads that block:
        # `migrate lint` reads no config file unless `--config` or `--env` is
        # given, whatever the working directory, and on its built-in defaults
        # data_depend is only a warning.
        #
        # A lint whose config silently stopped applying still passes every
        # real migration, so the same command must also REJECT a known-bad
        # one: a NOT NULL column with no default (MF103), which fails only
        # under atlas.hcl. The probe makes its own table, so it does not
        # depend on the real schema.
        run: |
          set -euo pipefail
          lint() {
            atlas migrate lint \
              --config 'file://packages/db/atlas.hcl' \
              --dir "file://$1" \
              --dev-url "postgres://atlas:atlas@localhost:5432/$2?sslmode=disable" \
              --latest 1
          }
          lint packages/db/migrations dev

          probe="$RUNNER_TEMP/lint-probe"
          cp -R packages/db/migrations "$probe"
          echo 'CREATE TABLE "lint_probe" ("id" integer);' > "$probe/9998_lint_probe_table.sql"
          echo 'ALTER TABLE "lint_probe" ADD COLUMN "required" text NOT NULL;' > "$probe/9999_lint_probe_column.sql"
          atlas migrate hash --dir "file://$probe"
          psql 'postgres://atlas:atlas@localhost:5432/postgres?sslmode=disable' \
            -v ON_ERROR_STOP=1 -qc 'CREATE DATABASE lint_probe;'
          if lint "$probe" lint_probe > "$RUNNER_TEMP/lint-probe.log" 2>&1; then
            cat "$RUNNER_TEMP/lint-probe.log"
            echo "::error::Lint accepted a NOT NULL column with no default: packages/db/atlas.hcl is not being applied."
            exit 1
          fi
          cat "$RUNNER_TEMP/lint-probe.log"
          if ! grep -q 'MF103' "$RUNNER_TEMP/lint-probe.log" ||
            ! grep -q 'version with errors' "$RUNNER_TEMP/lint-probe.log"; then
            echo "::error::The lint probe failed, but not with an MF103 error, so it did not test atlas.hcl."
            exit 1
          fi
          echo "✓ Lint rejects the known-bad probe, so atlas.hcl is applied."

      - name: Apply every migration to a throwaway database
        # THE CHECK THAT WAS MISSING, AND IT COST TWO PRODUCTION FAILURES.
        #
        # `migrate lint` reads migrations for dangerous SQL. It does not
        # execute the apply path, so it cannot see a malformed Atlas file
        # directive. `migration-apply.yml` does execute it — but it runs on
        # PUSH TO MAIN, i.e. after merge, where its failure surfaces nowhere
        # a reviewer looks.
        #
        # On 2026-08-20 migration 0065 failed to apply twice for two
        # different reasons, and both times the PR was fully green:
        #   1. a prose line quoting the txmode directive parsed AS the
        #      directive  -> `unknown txmode "none` is required: ...`
        #   2. the directive sat after a blank line, outside the leading
        #      comment block Atlas reads -> `CREATE INDEX CONCURRENTLY
        #      cannot run inside a transaction block`
        # Each left the migration queue blocked until someone checked
        # production by hand.
        #
        # Nothing else can catch this class. PGlite (the round-trip test in
        # packages/db) reads the SQL directly and never parses directives;
        # `atlas migrate validate` checks the sum file, not execution; and
        # `migrate lint` is content-only. Only a real apply runs the parser.
        #
        # FULL HISTORY, NOT `--latest 1`: directive and ordering faults can
        # come from the interaction between migrations, and the whole set is
        # only ~65 files against an empty database.
        #
        # Uses the same throwaway service container as lint. It never touches
        # production — the DSN is localhost — so this is safe to run on any
        # PR, including from a fork.
        run: |
          set -euo pipefail
          psql 'postgres://atlas:atlas@localhost:5432/postgres?sslmode=disable' \
            -v ON_ERROR_STOP=1 -c 'CREATE DATABASE apply_probe;'
          atlas migrate apply \
            --url 'postgres://atlas:atlas@localhost:5432/apply_probe?sslmode=disable' \
            --dir 'file://packages/db/migrations'
          echo "✓ Every migration applies cleanly from empty."
          # migration-apply.yml's post-apply check reads this same status
          # template against production. Prove it prints OK here first, so an
          # Atlas bump that changed it fails on the bump PR, not after a real
          # production apply.
          status=$(atlas migrate status \
            --url 'postgres://atlas:atlas@localhost:5432/apply_probe?sslmode=disable' \
            --dir 'file://packages/db/migrations' \
            --format '{{ .Status }}')
          if [ "$status" != "OK" ]; then
            echo "::error::migrate status printed '$status' after a full apply, expected OK."
            exit 1
          fi
          echo "✓ migrate status reports OK."

      - name: Verify rollback companion exists for every migration
        # Rollback files use the `.rollback` (no `.sql`) extension so Atlas
        # doesn't pick them up as additional migrations during `migrate lint`
        # — Atlas reads every `*.sql` in the dir and would otherwise apply
        # the rollback before the forward (alphabetical: `.rollback.sql`
        # sorted before `.sql`), failing on `DROP ... ON <table>` against an
        # empty DB.
        run: |
          set -euo pipefail
          missing=0
          for fwd in packages/db/migrations/*.sql; do
            rb="${fwd%.sql}.rollback"
            if [ ! -f "$rb" ]; then
              echo "::error file=$fwd::Missing rollback companion at $rb (D152)"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "Per D152, every forward migration ships with a *.rollback companion."
            exit 1
          fi
          echo "✓ All forward migrations have rollback companions."
