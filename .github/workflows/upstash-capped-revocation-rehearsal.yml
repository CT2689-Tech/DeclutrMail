name: Rehearse Upstash revocation on an approved capped fixture

on:
  workflow_dispatch:
    inputs:
      paid_test_confirmation:
        description: 'Only after explicit founder approval: type APPROVED_ONE_TEST_USD20_CAP (one PayG fixture, $20 monthly cap)'
        type: string
        required: true
        default: ''
  pull_request:
    paths:
      - '.github/workflows/upstash-capped-revocation-rehearsal.yml'
      - 'scripts/upstash-capped-revocation-rehearsal*'
      - 'scripts/upstash-free-revocation-rehearsal*'

permissions:
  contents: read

# Serialize both provider workflows; never cancel a runner before owned cleanup.
concurrency:
  group: upstash-revocation-provider-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/upstash-free-revocation-rehearsal.test.mjs
  upstash-capped-revocation-rehearse:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.paid_test_confirmation == 'APPROVED_ONE_TEST_USD20_CAP'
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: Sandbox
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify $20 cap before commands, observe reset, and delete owned fixture
        env:
          UPSTASH_EMAIL: ${{ secrets.UPSTASH_EMAIL }}
          UPSTASH_API_KEY: ${{ secrets.UPSTASH_API_KEY }}
          UPSTASH_PAID_TEST_CONFIRMATION: ${{ inputs.paid_test_confirmation }}
        run: node scripts/upstash-capped-revocation-rehearsal.mjs "${{ runner.temp }}/upstash-capped-revocation.json"
      - name: Preserve sanitized observations and cleanup failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstash-capped-revocation
          path: ${{ runner.temp }}/upstash-capped-revocation.json
          retention-days: 3
          if-no-files-found: error
