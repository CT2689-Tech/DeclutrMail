name: Rehearse checkout revocation in isolated Paddle sandbox

on:
  workflow_dispatch:
    inputs:
      rehearsal:
        description: checkout keeps revocation; pass runs Backlog Pass
        required: false
        default: checkout
        type: choice
        options:
          - checkout
          - pass

permissions:
  contents: read

concurrency:
  group: billing-upgrade-refund-sandbox
  cancel-in-progress: false

jobs:
  rehearse:
    # Pass stays in this job. Run 38186077360 added a new job id and
    # received an empty REHEARSAL_OPERATOR_KEY; the main rehearse job
    # receives it. Drop the feature-branch clause after the branch is gone.
    if: github.ref == 'refs/heads/main' || (github.event.inputs.rehearsal == 'pass' && github.ref == 'refs/heads/codex/ws1b-pricing-story-pass')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: Sandbox
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: refund_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d refund_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Migrate the disposable fixture database
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/refund_fixture
        run: |
          for migration in packages/db/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$migration"
          done
      - name: Boundary verification
        if: github.event.inputs.rehearsal != 'pass'
        run: pnpm --filter @declutrmail/api test src/billing/__tests__/sandbox-rehearsal-boundary.spec.ts src/billing/__tests__/sandbox-rehearsal-failure.spec.ts src/billing/__tests__/sandbox-checkout-revocation.spec.ts src/billing/__tests__/sandbox-checkout-proof.spec.ts src/billing/__tests__/sandbox-checkout-cleanup.spec.ts
      - name: Boundary verification
        if: github.event.inputs.rehearsal == 'pass'
        run: pnpm --filter @declutrmail/api test src/billing/__tests__/pass-rehearsal-assertions.spec.ts src/billing/__tests__/sandbox-rehearsal-boundary.spec.ts src/billing/__tests__/sandbox-rehearsal-failure.spec.ts
      - name: Install the checkout browser
        if: github.event.inputs.rehearsal == 'pass'
        run: pnpm --filter @declutrmail/e2e exec playwright install --with-deps chromium
      - name: Name the sandbox boundary shape
        if: github.event.inputs.rehearsal == 'pass'
        env:
          BILLING_REHEARSAL: sandbox
          PADDLE_ENV: sandbox
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
          REHEARSAL_OPERATOR_KEY: ${{ secrets.BILLING_REHEARSAL_OPERATOR_KEY }}
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/refund_fixture
          REHEARSAL_REPORT_PATH: ${{ runner.temp }}/pass-sandbox-rehearsal.json
        run: |
          fail=0
          shape() {
            if [ -z "$2" ]; then echo "boundary $1=absent"; return 1; fi
            if printf '%s' "$2" | grep -Eq "$3"; then echo "boundary $1=ok"; return 0; fi
            echo "boundary $1=mismatch"
            return 1
          }
          shape GITHUB_ACTIONS "$GITHUB_ACTIONS" '^true$' || fail=1
          shape GITHUB_RUN_ID "$GITHUB_RUN_ID" '^[0-9]+$' || fail=1
          shape GITHUB_RUN_ATTEMPT "$GITHUB_RUN_ATTEMPT" '^[0-9]+$' || fail=1
          shape REHEARSAL_OPERATOR_KEY "$REHEARSAL_OPERATOR_KEY" '^[a-f0-9]{64}$' || fail=1
          shape BILLING_REHEARSAL "$BILLING_REHEARSAL" '^sandbox$' || fail=1
          shape PADDLE_ENV "$PADDLE_ENV" '^sandbox$' || fail=1
          shape PADDLE_API_KEY "$PADDLE_API_KEY" '^pdl_sdbx_apikey_[a-z0-9]{26}_[a-zA-Z0-9]{22}_[a-zA-Z0-9]{3}$' || fail=1
          shape DATABASE_URL "$DATABASE_URL" '^postgres://postgres:postgres@127\.0\.0\.1:5432/refund_fixture$' || fail=1
          exit "$fail"
      - name: Start isolated synthetic UI and signed webhook receiver
        if: github.event.inputs.rehearsal != 'pass'
        env:
          BILLING_REHEARSAL: sandbox
          PADDLE_ENV: sandbox
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
          REHEARSAL_OPERATOR_KEY: ${{ secrets.BILLING_REHEARSAL_OPERATOR_KEY }}
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/refund_fixture
          REHEARSAL_REPORT_PATH: ${{ runner.temp }}/checkout-revocation-rehearsal.json
        run: |
          curl --fail --location --silent --show-error https://github.com/cloudflare/cloudflared/releases/download/2026.10.0/cloudflared-linux-amd64 -o "$RUNNER_TEMP/cloudflared"
          echo 'd33ff2d14475178d2012c2c56beba87389ac5ded27649519f198a7d3134a99db  '"$RUNNER_TEMP/cloudflared" | sha256sum --check --strict
          chmod 700 "$RUNNER_TEMP/cloudflared"
          env -u PADDLE_API_KEY -u REHEARSAL_OPERATOR_KEY -u DATABASE_URL "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate --url http://127.0.0.1:4049 > "$RUNNER_TEMP/tunnel.log" 2>&1 &
          tunnel_pid=$!
          trap 'kill "$tunnel_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            fixture_url=$(sed -nE 's/.*(https:\/\/[a-z0-9-]+\.trycloudflare\.com).*/\1/p' "$RUNNER_TEMP/tunnel.log" | head -1)
            if [ -n "$fixture_url" ]; then break; fi
            sleep 1
          done
          if [ -z "$fixture_url" ]; then exit 1; fi
          export REHEARSAL_PUBLIC_URL="$fixture_url"
          cd apps/api && node --import @swc-node/register/esm-register scripts/billing-checkout-revocation-rehearsal.ts
      - name: Retain only sanitized proof and cleanup outcomes
        if: always() && github.event.inputs.rehearsal != 'pass'
        uses: actions/upload-artifact@v7
        with:
          name: checkout-revocation-rehearsal
          path: ${{ runner.temp }}/checkout-revocation-rehearsal.json
          retention-days: 1
          if-no-files-found: error
      - name: Pay the sandbox Pass and annual prices
        if: github.event.inputs.rehearsal == 'pass'
        env:
          BILLING_REHEARSAL: sandbox
          PADDLE_ENV: sandbox
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
          REHEARSAL_OPERATOR_KEY: ${{ secrets.BILLING_REHEARSAL_OPERATOR_KEY }}
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/refund_fixture
          REHEARSAL_REPORT_PATH: ${{ runner.temp }}/pass-sandbox-rehearsal.json
        run: |
          curl --fail --location --silent --show-error https://github.com/cloudflare/cloudflared/releases/download/2026.10.0/cloudflared-linux-amd64 -o "$RUNNER_TEMP/cloudflared"
          echo 'd33ff2d14475178d2012c2c56beba87389ac5ded27649519f198a7d3134a99db  '"$RUNNER_TEMP/cloudflared" | sha256sum --check --strict
          chmod 700 "$RUNNER_TEMP/cloudflared"
          env -u PADDLE_API_KEY -u REHEARSAL_OPERATOR_KEY -u DATABASE_URL "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate --url http://127.0.0.1:4049 > "$RUNNER_TEMP/tunnel.log" 2>&1 &
          tunnel_pid=$!
          trap 'kill "$tunnel_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            fixture_url=$(sed -nE 's/.*(https:\/\/[a-z0-9-]+\.trycloudflare\.com).*/\1/p' "$RUNNER_TEMP/tunnel.log" | head -1)
            if [ -n "$fixture_url" ]; then break; fi
            sleep 1
          done
          if [ -z "$fixture_url" ]; then echo 'boundary REHEARSAL_PUBLIC_URL=absent'; exit 1; fi
          export REHEARSAL_PUBLIC_URL="$fixture_url"
          if printf '%s' "$REHEARSAL_PUBLIC_URL" | grep -Eq '^https://[a-z0-9-]+\.trycloudflare\.com$'; then
            echo 'boundary REHEARSAL_PUBLIC_URL=ok'
          else
            echo 'boundary REHEARSAL_PUBLIC_URL=mismatch'
            exit 1
          fi
          cd apps/api && node --import @swc-node/register/esm-register scripts/billing-pass-sandbox-rehearsal.ts
      - name: Retain only sanitized proof and cleanup outcomes
        if: always() && github.event.inputs.rehearsal == 'pass'
        uses: actions/upload-artifact@v7
        with:
          name: pass-sandbox-rehearsal
          path: ${{ runner.temp }}/pass-sandbox-rehearsal.json
          retention-days: 1
          if-no-files-found: error
