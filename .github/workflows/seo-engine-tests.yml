name: SEO engine contracts

on:
  pull_request:
    paths:
      - 'scripts/seo-engine*'
      - 'docs/execution/marketing-system/seo-engine*'
      - '.github/workflows/seo-engine-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/seo-engine*'
      - 'docs/execution/marketing-system/seo-engine*'
      - '.github/workflows/seo-engine-tests.yml'
  merge_group:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/seo-engine.test.mjs
