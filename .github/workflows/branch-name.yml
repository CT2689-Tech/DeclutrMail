name: Branch name + PR title

on:
  # No `branches:` filter — see the note in ci.yml. A stacked PR (base is
  # another feature branch) skipped this gate entirely, so a §6-violating
  # branch name only surfaced once the stack was retargeted onto main.
  # No `ready_for_review` — see the note in ci.yml. Un-drafting yields no
  # new SHA and nothing here skips drafts, so it only re-ran checks that
  # had already passed.
  pull_request:
    types: [opened, edited, reopened, synchronize]
  # MERGE QUEUE. All three checks here are REQUIRED, so the queue waits
  # on them — and a workflow that never fires on `merge_group` hangs
  # every entry silently, with no failure to read.
  #
  # They are also the three that cannot meaningfully RUN there: each
  # reads pull-request metadata (head ref, title, body), and a merge
  # group has no pull request. So they fire, say they have nothing to
  # check, and pass.
  #
  # That is not a hole. Every one was enforced on the PR before it was
  # allowed to queue, and none describes the merged RESULT — a branch
  # name cannot become invalid by sitting behind another entry. The
  # steps are gated individually rather than the jobs being skipped:
  # a skipped required check is *treated* as a pass by branch
  # protection, but that is a rule about GitHub's behaviour rather than
  # about ours, and a queue that hangs on a wrong guess about it is
  # exactly the failure this trigger exists to prevent.
  merge_group:

permissions:
  pull-requests: read

jobs:
  branch-name:
    name: Branch follows CLAUDE.md §6 convention
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Dependabot picks its own branch names (`dependabot/<ecosystem>/...`).
    # The §6 convention is about traceability between D-decisions and
    # human-authored work — dependency bumps have no D-tie by design, so
    # exempt the bot rather than rename its branches. The substantive
    # gates (Typecheck / Lint / Test) still run.
    # The head-ref check covers follow-up commits pushed by a human to a
    # bot branch (e.g. fixing a major-version migration) — that flips
    # `github.actor`, but the branch is still bot-named.
    if: github.actor != 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/')
    steps:
      - name: Nothing to check in a merge queue
        if: github.event_name == 'merge_group'
        run: echo "✓ No pull request in a merge group — enforced before queueing."
      - name: Validate branch name
        if: github.event_name != 'merge_group'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # Allowed:
          #   <type>/d<NNN>-<kebab>      e.g. feat/d011-drizzle-orm-setup
          #   chore/bootstrap-<topic>    e.g. chore/bootstrap-pr1b
          #   chore/distill-<topic>      e.g. chore/distill-smoke-test-rule
          #   codex/<kebab>              e.g. codex/d246-behavioral-activation-trust
          # See CLAUDE.md §6 + §11; PR #58 added `distill-` to local hooks
          # for founder-owned CLAUDE.md distillation PRs — this workflow
          # mirrors that authoritatively.
          # `codex/` sanctioned 2026-07-15 (founder call, FOUNDER-FOLLOWUPS):
          # the Codex companion ships real PRs from codex/<slug> branches
          # (#333 merged, #334). D-traceability is preserved by the still-
          # enforced commit `(D###)` trailers and the pr-body `Closes D###`
          # check below — same reasoning as the dependabot exemption.
          # `claude/` sanctioned 2026-08-11 (founder call, FOUNDER-FOLLOWUPS):
          # Claude Code on the web assigns `claude/<slug>` and the session is
          # forbidden from renaming it — identical position to codex/, so it
          # gets the identical exemption and the identical obligations.
          if ! echo "$HEAD_REF" | grep -qE '^((feat|fix|chore|docs|refactor|test|perf|security)/d[0-9]{3}-|chore/(bootstrap|distill)-|(codex|claude)/[a-z0-9][a-z0-9-]*$)'; then
            echo "::error::Branch '${HEAD_REF}' does not match the CLAUDE.md §6 naming convention."
            echo "Expected: <type>/d<NNN>-<kebab>  OR  chore/bootstrap-<topic>  OR  chore/distill-<topic>"
            echo "Allowed types: feat, fix, chore, docs, refactor, test, perf, security"
            exit 1
          fi
          echo "✓ Branch name passes CLAUDE.md §6 convention."

  pr-title:
    name: PR title follows Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Nothing to check in a merge queue
        if: github.event_name == 'merge_group'
        run: echo "✓ No pull request in a merge group — enforced before queueing."
      # Aligned with commitlint.config.cjs subject-case rule (never pascal-case
      # or upper-case). No subjectPattern — allows leading proper nouns
      # ("OAuth", "TypeScript") and abbreviations ("PR", "CI", "API") which
      # the previous `^(?![A-Z]).+$` rule incorrectly rejected.
      - uses: amannn/action-semantic-pull-request@v6
        if: github.event_name != 'merge_group'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            perf
            security
          requireScope: false

  pr-body:
    name: PR body references D-decisions or is bootstrap-exempt
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Dependabot bodies are auto-generated changelog dumps with no
    # `Closes D###` trailer — same reasoning as the branch-name job
    # above: exempt the bot, not rename its convention (and keep the
    # exemption when a human pushes follow-up commits to the bot branch).
    if: github.actor != 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/')
    steps:
      - name: Nothing to check in a merge queue
        if: github.event_name == 'merge_group'
        run: echo "✓ No pull request in a merge group — enforced before queueing."
      - name: Check body
        if: github.event_name != 'merge_group'
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # Bootstrap + distill PRs are exempt from `Closes D###` per
          # CLAUDE.md §6 + §11 (distill PRs promote learnings into
          # CLAUDE.md and never ship a D-decision themselves).
          if echo "$HEAD_REF" | grep -qE '^chore/(bootstrap|distill)-'; then
            echo "✓ Bootstrap/distill branch — exempt from Closes D### requirement."
            exit 0
          fi
          # `claude/` branches may DECLARE no D-tie instead of citing one
          # (founder call 2026-08-28). Claude Code on the web assigns the
          # branch name and the session is forbidden from renaming it, so
          # the previous advice in this job's own error message — "rename
          # the branch to chore/bootstrap-*" — was unreachable from a web
          # session. D-less web work (QA tooling, docs rescues, process
          # changes) therefore could not go green by any route it could
          # actually take. #661 and #662 hit this and were rebranched by
          # hand; #666 could not be.
          #
          # Deliberately NOT a blanket exemption. Most `claude/` PRs DO
          # ship D-decisions, and a branch-name-only exemption would let
          # every one of them omit `Closes D###` in silence — leaving the
          # IMPLEMENTATION-LOG row unflipped with no signal, which is the
          # traceability §6 exists to provide. Requiring the declaration
          # keeps the choice conscious and greppable; both #661 and #662
          # already wrote exactly this sentence in prose.
          #
          # Matched in-process for the same SIGPIPE reason as the
          # `Closes D###` check below — see the comment there.
          if [[ "$HEAD_REF" == claude/* ]] && [[ "$PR_BODY" =~ [Nn]o[[:blank:]]+D-(tie|number) ]]; then
            echo "✓ claude/ branch explicitly declares no D-tie — exempt."
            exit 0
          fi
          # Non-bootstrap/distill: must have at least one `Closes D###`.
          #
          # Matched in-process, NOT via `printf "$PR_BODY" | grep -q`.
          # `grep -q` exits the moment it matches; printf is then still
          # writing the rest of the body, takes SIGPIPE, and `pipefail`
          # promotes that to a pipeline failure — so a body that DOES
          # carry the reference gets reported as missing one. PR #477
          # hit exactly that: `Closes D112` on line 1 of a 3.5 KB body,
          # passing on one run and failing the next with
          # `printf: write error: Broken pipe`. The race is only
          # reachable when the match is early AND the payload is large,
          # which is why the two `$HEAD_REF` greps above are left alone
          # — a branch name is one short write that always completes.
          # `[[:blank:]]` (space/tab), not `[[:space:]]`: grep matched per
          # LINE, so `Closes` and `D112` on separate lines never counted.
          # `[[:space:]]` includes newline and would silently loosen that.
          if [[ "$PR_BODY" =~ Closes[[:blank:]]+D[0-9]{1,3} ]]; then
            echo "✓ PR body contains Closes D### reference."
            exit 0
          fi
          echo "::error::PR body must contain at least one 'Closes D###' reference (CLAUDE.md §6)."
          echo "If this PR genuinely has no D-tie: on a claude/ branch, say so in the body"
          echo "(e.g. 'No D-tie — Tier 2 tooling'); otherwise rename the branch to"
          echo "chore/bootstrap-<topic> or chore/distill-<topic>."
          exit 1
