name: Refresh production Paddle key binding

# Incident-only rollout: use the images already serving production. A normal
# main deploy currently has an unrelated unready API revision.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-cloud-run-production
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT: declutrmail-ai-prod
      SECRET_VERSION: '3'
    steps:
      - name: Authenticate with existing deploy identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Confirm replacement secret is enabled
        run: |
          set -euo pipefail
          state=$(gcloud secrets versions describe "$SECRET_VERSION" \
            --secret=paddle-api-key-prod --project="$PROJECT" --format='value(state)')
          test "$state" = ENABLED
          echo "Paddle secret version $SECRET_VERSION is enabled."
      - name: Refresh API using its serving image, then route traffic
        run: |
          set -euo pipefail
          service=declutrmail-api
          region=us-central1
          expected=declutrmail-api-01043-yub
          current=$(gcloud run services describe "$service" \
            --project="$PROJECT" --region="$region" --format=json)
          old=$(jq -er '[.status.traffic[]? | select(.percent == 100) | .revisionName] | if length == 1 then .[0] else empty end' <<<"$current")
          test "$old" = "$expected"
          image=$(gcloud run revisions describe "$old" \
            --project="$PROJECT" --region="$region" \
            --format='value(spec.containers[0].image)')
          test -n "$image"
          gcloud run services update "$service" \
            --project="$PROJECT" --region="$region" --quiet \
            --image="$image" \
            --update-secrets="PADDLE_API_KEY=paddle-api-key-prod:$SECRET_VERSION" \
            --no-traffic
          updated=$(gcloud run services describe "$service" \
            --project="$PROJECT" --region="$region" --format=json)
          new=$(jq -er '.status.latestCreatedRevisionName' <<<"$updated")
          ready=$(jq -er '.status.latestReadyRevisionName' <<<"$updated")
          test "$new" != "$old"
          test "$ready" = "$new"
          jq -e --arg old "$old" \
            '[.status.traffic[]? | select(.percent == 100) | .revisionName] == [$old]' \
            <<<"$updated" >/dev/null
          gcloud run revisions describe "$new" \
            --project="$PROJECT" --region="$region" --format=json \
            | jq -e --arg image "$image" --arg version "$SECRET_VERSION" '
                .spec.containers[0].image == $image and
                ([.spec.containers[0].env[]? |
                  select(.name == "PADDLE_API_KEY") |
                  .valueFrom.secretKeyRef.key] == [$version])
              ' >/dev/null
          gcloud run services update-traffic "$service" \
            --project="$PROJECT" --region="$region" --quiet \
            --to-revisions="$new=100"
          gcloud run services describe "$service" \
            --project="$PROJECT" --region="$region" --format=json \
            | jq -e --arg new "$new" '
                [.status.traffic[]? | select(.percent == 100) | .revisionName] == [$new]
              ' >/dev/null
          echo "API serving $new with Paddle secret version $SECRET_VERSION."
          if ! curl --fail --silent --show-error --max-time 20 \
            --output /dev/null https://api.declutrmail.com/api/healthz; then
            gcloud run services update-traffic "$service" \
              --project="$PROJECT" --region="$region" --quiet \
              --to-revisions="$old=100"
            echo 'API health failed; restored previous serving revision.' >&2
            exit 1
          fi
          echo 'API health endpoint passed.'
      - name: Refresh worker using its serving image, then route traffic
        run: |
          set -euo pipefail
          service=declutrmail-worker
          region=us-west1
          expected=declutrmail-worker-00312-lvx
          current=$(gcloud run services describe "$service" \
            --project="$PROJECT" --region="$region" --format=json)
          old=$(jq -er '[.status.traffic[]? | select(.percent == 100) | .revisionName] | if length == 1 then .[0] else empty end' <<<"$current")
          test "$old" = "$expected"
          image=$(gcloud run revisions describe "$old" \
            --project="$PROJECT" --region="$region" \
            --format='value(spec.containers[0].image)')
          test -n "$image"
          gcloud run services update "$service" \
            --project="$PROJECT" --region="$region" --quiet \
            --image="$image" \
            --update-secrets="PADDLE_API_KEY=paddle-api-key-prod:$SECRET_VERSION" \
            --no-traffic
          updated=$(gcloud run services describe "$service" \
            --project="$PROJECT" --region="$region" --format=json)
          new=$(jq -er '.status.latestCreatedRevisionName' <<<"$updated")
          ready=$(jq -er '.status.latestReadyRevisionName' <<<"$updated")
          test "$new" != "$old"
          test "$ready" = "$new"
          jq -e --arg old "$old" \
            '[.status.traffic[]? | select(.percent == 100) | .revisionName] == [$old]' \
            <<<"$updated" >/dev/null
          gcloud run revisions describe "$new" \
            --project="$PROJECT" --region="$region" --format=json \
            | jq -e --arg image "$image" --arg version "$SECRET_VERSION" '
                .spec.containers[0].image == $image and
                ([.spec.containers[0].env[]? |
                  select(.name == "PADDLE_API_KEY") |
                  .valueFrom.secretKeyRef.key] == [$version])
              ' >/dev/null
          gcloud run services update-traffic "$service" \
            --project="$PROJECT" --region="$region" --quiet \
            --to-revisions="$new=100"
          gcloud run services describe "$service" \
            --project="$PROJECT" --region="$region" --format=json \
            | jq -e --arg new "$new" '
                [.status.traffic[]? | select(.percent == 100) | .revisionName] == [$new]
              ' >/dev/null
          echo "Worker serving $new with Paddle secret version $SECRET_VERSION."
