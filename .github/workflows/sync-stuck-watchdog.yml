# Sync-stuck / sync-failed watchdog (D38, D224, D159).
#
# Reads the Supabase prod DB directly. Two independent checks, both
# against `provider_sync_state`:
#   - check-sync-stuck.sh:  syncs WEDGED in `queued`/`syncing` (never
#     reached a terminal state — `current_stage NOT IN ('ready','failed')`).
#   - check-sync-failed.sh: INITIAL syncs that reached the TERMINAL
#     `failed` state and sat there, unretried, past STUCK_FAILED_HOURS.
#     Added 2026-09-02 — check-sync-stuck.sh's query explicitly excludes
#     `failed`, so a mailbox that dead-letters (e.g. a Gmail
#     RateLimitError that outlasted its retries) was invisible to any
#     watchdog; two first-run signups stranded there with nobody
#     watching, one of the "guard whose input can be empty and never
#     distinguishes that from healthy" defects CLAUDE.md §8 warns about.
#     Incremental-sync failures are a different signal
#     (`last_incremental_error_at`, self-healed by a 5-min cron drift
#     sweep) and are NOT covered by either check — see check-sync-failed.sh.
#
# Red means something NEW. A stuck row listed in
# scripts/known-stuck-mailboxes.tsv — matched on mailbox AND stuck-since
# instant, so a retry that fails again is new — prints as a warning on
# every run and does not fail it (scripts/filter-known-stuck.sh). Before
# that list, this workflow failed on every run from 2026-09-03 for the
# same two first-scan failures, so a third stuck mailbox would have
# changed nothing anyone looked at. To acknowledge a row, paste the line
# the failing run prints into that file.
#
# Both scripts run even if one fails (`|| rc=1`, no `set -e` across
# them) — a step that stops at the first failure would let a stuck-sync
# alert mask a same-tick failed-sync alert, or vice versa. When a
# scheduled run fails, GitHub notifies the account that last changed the
# `cron:` line, per that account's notification settings; the printed
# `::error::` lines say which check(s) fired.
#
# A backstop, not the pager:
#   * The schedule asks for every 5 minutes. GitHub started it 5-8 times
#     a day from 2026-09-15 to 2026-09-25 (the */15 cron-stale watchdog
#     got the same), so a new stuck row can take hours to turn this red.
#     The pager is the Cloud Monitoring alert fed by the worker's
#     15-minute sweep, one alert per mailbox
#     (scripts/setup-stuck-mailbox-alert.mjs).
#   * It stays because it reads the database directly, so it still works
#     when the worker or Cloud Logging does not. Cloud Monitoring can't
#     query an external Supabase DB without a Cloud Run Job + Scheduler +
#     IAM bindings; GH Actions cron is free + already authed via the
#     SUPABASE_SESSION_DSN secret.
#
# Privacy (D7 / D228): script reads ONLY `provider_sync_state`. No
# `mail_messages` / `senders` / `triage_decisions` access. The alert
# body carries mailbox_account_id (a UUID, not user-identifiable in
# isolation) + stuck-since + stage/error + progress + stuck_seconds.

name: Sync-stuck / sync-failed watchdog

on:
  schedule:
    # Asks for every 5 min; GitHub starts it far less often (see "A
    # backstop, not the pager" above). STUCK_MINUTES = 10 is about the
    # sync's own backoff, not GitHub's timing — see the job step below.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync-stuck-watchdog-${{ github.ref }}
  # NEVER cancel an in-flight check — that masks real stuck syncs.
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install psql
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-client

      - name: Check for stuck + failed syncs
        env:
          SUPABASE_SESSION_DSN: ${{ secrets.SUPABASE_SESSION_DSN }}
          # 10, not 5: the 2026-09-02 backoff fix lets a single
          # `perMailboxPolicy` retry legitimately wait up to
          # `rateLimitMaxDelayMs` (5 min — see rate-limit-backoff.ts)
          # with `provider_sync_state.updated_at` frozen the whole time
          # (only `onTerminalFailure` writes it, not a mid-backoff
          # retry). At the old 5-min threshold a mailbox correctly
          # backing off from a RateLimitError would page this watchdog
          # as "stuck" — alert fatigue on the exact channel this PR
          # relies on for the failed-sync check below.
          STUCK_MINUTES: '10'
          STUCK_FAILED_HOURS: '2'
        run: |
          # No `set -e` across the two checks: each must run regardless
          # of the other's result, or the first failure masks the second
          # check for the rest of the tick.
          set -uo pipefail
          chmod +x scripts/check-sync-stuck.sh scripts/check-sync-failed.sh
          rc=0
          ./scripts/check-sync-stuck.sh || rc=1
          ./scripts/check-sync-failed.sh || rc=1
          exit "$rc"
