name: CI

on:
  # No `branches:` filter BY DESIGN. Restricting to `[main]` meant a
  # stacked PR — one whose base is another feature branch — ran ZERO
  # substantive CI, and its checks tab was empty rather than red. An
  # untested stack then looked exactly like a tested one at merge time
  # (2026-08-08; #475 merged into an already-squashed base and reached
  # no branch at all).
  #
  # Do NOT listen for `edited` here. Title/body edits used to retrigger
  # the full ~12 min suite (and cancel the in-flight run). Retargeting a
  # stacked PR onto main still fires only `edited` — fire CI by hand in
  # that case: `gh workflow run ci.yml --ref <branch>`. Branch-name.yml
  # keeps `edited` so title/body checks still update.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

  # Manual trigger fallback — PR #178 hit a case on 2026-06-10 where
  # pull_request silently did not dispatch despite base + branch matching
  # and no path/draft/concurrency exclusion. Lets the founder fire CI by
  # hand on a branch when needed.
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which expensive shards actually need to run for this diff.
  #
  # A docs- or scripts-only PR was booting Postgres, installing the whole
  # workspace six times and running every Vitest suite — PR #384 changed
  # MISTAKES.md and one .mjs and still spent 5m in Tests — Workers alone.
  #
  # Two deliberate safety properties:
  #   * Each filter includes the shared `infra` set (lockfile, workspace
  #     manifests, tsconfig, .nvmrc, packages/config, and THIS file). A
  #     dependency bump or a change to CI itself must re-run everything —
  #     the whole point of a filter is lost if it can hide a broken lockfile.
  #   * Filters gate `pull_request` ONLY. A push to main always runs the
  #     full suite (see each `if:`), so the protected branch is never
  #     validated by a subset. Skipping on a PR is an optimisation;
  #     skipping on main would be a coverage hole.
  #
  # Typecheck / Lint / Format stay ungated on purpose: ~2 min combined, and
  # they are the checks that cover scripts/ and *.md — exactly the files a
  # path filter would otherwise exempt from all review.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      workers: ${{ steps.filter.outputs.workers }}
      db: ${{ steps.filter.outputs.db }}
      web: ${{ steps.filter.outputs.web }}
      units: ${{ steps.filter.outputs.units }}
      a11y: ${{ steps.filter.outputs.a11y }}
    steps:
      - uses: actions/checkout@v7
      # A `!` pattern here does not subtract — it makes the rule ALWAYS
      # TRUE. dorny/paths-filter compiles each pattern separately and ORs
      # them (`patterns.some(...)`), so `!foo/**` matches every path
      # outside `foo/`. That shipped once and went unnoticed because the
      # failure mode is a filter that quietly says "yes" to everything.
      - name: Reject negation patterns in the path filters
        run: |
          if grep -nE "^\s+- '!" .github/workflows/ci.yml; then
            echo "::error::A '!' pattern makes its whole filter rule match every file." \
                 "dorny/paths-filter ORs patterns; negation cannot subtract. Use an allowlist."
            exit 1
          fi
          echo "✓ No negation patterns in the path filters."
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra: &infra
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'tsconfig*.json'
              - '.nvmrc'
              - 'packages/config/**'
              - '.github/workflows/ci.yml'
            # UI-only shared paths must not boot the API/worker PGlite
            # suites — a Button.tsx tweak was paying the full API run.
            #
            # Expressed as an ALLOWLIST, not `!` exclusions. dorny/paths-filter
            # ORs its patterns (`patterns.some(...)`, default quantifier
            # `some`), so a `!` pattern matches every path OUTSIDE its own
            # directory and turns the whole rule permanently true — a
            # README-only PR would boot every Postgres shard. Neither
            # `predicate-quantifier` value fixes that: `every` would demand a
            # file match `apps/api/**` AND `packages/db/**` at once.
            #
            # The closure is re-derivable; both packages import subpath
            # exports only, never the `.` barrel:
            #   grep -rhoE "from '@declutrmail/shared[^']*'" apps/api/src packages/workers/src | sort -u
            # `actions` reaches `../tokens`, but only from a `.stories.tsx`
            # that no server entry point imports. `package.json` is listed so
            # that ADDING a subpath export re-runs both suites by itself.
            shared_server: &shared_server
              - 'packages/shared/package.json'
              - 'packages/shared/tsconfig.json'
              - 'packages/shared/src/actions/**'
              - 'packages/shared/src/contracts/**'
              - 'packages/shared/src/copy/**'
              - 'packages/shared/src/entitlements/**'
              - 'packages/shared/src/observability/**'
              - 'packages/shared/src/senders/**'
            api:
              - *infra
              - 'apps/api/**'
              - 'packages/db/**'
              - 'packages/events/**'
              # 40 files under apps/api/src import @declutrmail/workers, so a
              # worker-only behaviour change still has to run this suite.
              - 'packages/workers/**'
              - *shared_server
            workers:
              - *infra
              - 'packages/workers/**'
              - 'packages/db/**'
              - 'packages/events/**'
              - *shared_server
            db:
              - *infra
              - 'packages/db/**'
            web:
              - *infra
              - 'apps/web/**'
              - 'packages/shared/**'
            units:
              - *infra
              - 'packages/shared/**'
              - 'packages/events/**'
            a11y:
              - *infra
              - 'apps/web/**'
              - 'apps/api/**'
              - 'packages/db/**'
              - 'packages/shared/**'

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  impl-log:
    name: Implementation log is derived and current
    # PR-only BY DESIGN, and now honestly so. The generator used to derive
    # from merged PRs alone, which left main stale by exactly the rows of
    # whichever PR had just merged — and the NEXT PR, innocent of the
    # change, inherited the red and absorbed it by hand. Five PRs in
    # flight on 2026-08-11 meant five rounds of laundering each other's
    # drift. The generator now also counts the open PR it is running for,
    # so a `Closes`-bearing PR carries its own flip and main is never
    # behind. Running this on push-to-main as well would add nothing but
    # a window of red nobody can act on — the permanently-red-guardrail
    # class this repo keeps relearning.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Recomputes ⬜/🔵 from the plan + merged `Closes D###` trailers and
      # fails when the committed IMPLEMENTATION-LOG.md disagrees. This
      # replaced pr-merged.yml's push-to-main flip, which branch
      # protection rejected on EVERY run — it never once wrote a flip
      # (D158, 2026-07-28). Fix a failure here with:
      #   pnpm generate-impl-log && git add IMPLEMENTATION-LOG.md
      - run: pnpm generate-impl-log --check
        env:
          GH_TOKEN: ${{ github.token }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  test-api:
    name: Tests — API
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: declutrmail_quota_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # NO `--` before the flag. `pnpm run <script> -- --shard=…` forwards a
      # LITERAL `--` into the script, so vitest's cac parser files everything
      # after it under `argv['--']` and silently ignores it — both matrix legs
      # then run the whole suite, which is exactly as slow as not sharding and
      # reports green. The denominator is `strategy.job-total` so that resizing
      # the matrix cannot leave a stale `/2` running half the suite green.
      - run: pnpm --filter @declutrmail/api test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          CLEANUP_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/declutrmail_quota_test

  test-workers:
    name: Tests — Workers
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.workers == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # The outbox dispatcher's SKIP LOCKED proof needs MULTIPLE real
    # connections — PGlite is single-connection in-process and cannot
    # model two ticks racing for the same rows. Without this service the
    # `describe.skipIf(!OUTBOX_TEST_PG_URL)` block never ran anywhere,
    # and the only thing standing between a lost `FOR UPDATE SKIP
    # LOCKED` and duplicate email delivery was a sibling test that
    # asserts the SQL *string*.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: declutrmail_outbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # See the note on the API shard above — no `--` before the flag.
      - run: pnpm --filter @declutrmail/workers test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          # A DEDICATED, EMPTY database — the test applies every
          # migration to it. Schema-level isolation is not an option:
          # the migrations write `CREATE TYPE "public"."<enum>"` and
          # then reference the type unqualified, so a redirected
          # search_path breaks the first migration.
          OUTBOX_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/declutrmail_outbox_test

  test-db:
    name: Tests — Database
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.db == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @declutrmail/db test

  test-web:
    name: Tests — Web
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @declutrmail/web test

  test-units:
    name: Tests — Shared units
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.units == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm
          --filter @declutrmail/config
          --filter @declutrmail/events
          --filter @declutrmail/shared
          test

  # Stable aggregate check for merge rules. Sharding prevents six Vitest
  # processes from fighting over one runner; the path filter above decides
  # which shards are relevant to the diff at all.
  #
  # `skipped` is an ACCEPTED result here, which makes this job the one place
  # that could quietly turn "we ran nothing" into a green Test ✅. So it
  # names the split in the run summary rather than collapsing both states
  # into a checkmark — a passing aggregate must say what it actually
  # covered. `failure` and `cancelled` are still hard failures.
  #
  # `changes` is in `needs` on purpose: if path detection itself breaks,
  # every shard skips, and without this guard the aggregate would report
  # green having run zero tests.
  test:
    name: Test
    if: ${{ always() }}
    needs: [changes, impl-log, test-api, test-workers, test-db, test-web, test-units]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected test shard
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          EVENT_NAME: ${{ github.event_name }}
          IMPL_LOG_RESULT: ${{ needs.impl-log.result }}
          API_RESULT: ${{ needs.test-api.result }}
          WORKERS_RESULT: ${{ needs.test-workers.result }}
          DB_RESULT: ${{ needs.test-db.result }}
          WEB_RESULT: ${{ needs.test-web.result }}
          UNITS_RESULT: ${{ needs.test-units.result }}
        run: |
          set -euo pipefail

          # Path detection failing must never read as "nothing to test".
          if [ "$CHANGES_RESULT" != success ]; then
            echo "::error::path detection did not succeed ($CHANGES_RESULT) —" \
                 "shard selection is unknown, so this cannot pass"
            exit 1
          fi

          # The derived implementation log is a MUST-PASS on pull requests:
          # a stale log means a merged PR's Closes flip was not committed.
          # On push-to-main the job is skipped by design (see its `if`) —
          # only an outright failure or a PR-context skip is an error.
          if [ "$IMPL_LOG_RESULT" != success ]; then
            if [ "$EVENT_NAME" = pull_request ] || [ "$IMPL_LOG_RESULT" != skipped ]; then
              if [ "$IMPL_LOG_RESULT" = cancelled ]; then
                echo "::error::implementation log check was cancelled — a newer push superseded this run"
              else
                echo "::error::implementation log check did not succeed ($IMPL_LOG_RESULT) —" \
                     "run 'pnpm generate-impl-log' and commit the result"
              fi
              exit 1
            fi
          fi

          ran=''; skipped=''; bad=''
          classify() {
            case "$2" in
              success) ran="$ran $1" ;;
              skipped) skipped="$skipped $1" ;;
              *) bad="$bad $1=$2" ;;
            esac
          }
          classify api "$API_RESULT"
          classify workers "$WORKERS_RESULT"
          classify db "$DB_RESULT"
          classify web "$WEB_RESULT"
          classify units "$UNITS_RESULT"

          {
            echo "### Test shards"
            echo
            echo "- **ran:**${ran:- none}"
            echo "- **skipped** (no matching path changed):${skipped:- none}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ran:${ran:- none}"
          echo "skipped:${skipped:- none}"

          if [ -n "$bad" ]; then
            echo "::error::test shard(s) did not succeed:$bad"
            exit 1
          fi

  accessibility:
    name: Authenticated accessibility smoke
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.a11y == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: declutrmail
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d declutrmail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/declutrmail
      REDIS_URL: redis://127.0.0.1:6379/12
      RATE_LIMIT_ENABLED: 'false'
      JWT_ACCESS_SECRET: e2e-access-secret-is-longer-than-thirty-two-bytes
      JWT_REFRESH_SECRET: e2e-refresh-secret-is-different-and-long-enough
      GOOGLE_CLIENT_ID: e2e-google-client
      GOOGLE_CLIENT_SECRET: e2e-google-secret
      GOOGLE_REDIRECT_URI: http://127.0.0.1:4104/api/auth/google/callback
      ENCRYPTION_LOCAL_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
      DEV_AUTH_ENABLED: 'true'
      DEV_AUTH_EMAIL_PREFIX: chintan.e2e.
      WEB_URL: http://127.0.0.1:3104
      CORS_ORIGIN: http://127.0.0.1:3104
      E2E_WEB_URL: http://127.0.0.1:3104
      E2E_API_URL: http://127.0.0.1:4104
      E2E_LOGIN_EMAIL: chintan.e2e.billing@synthetic.test
      E2E_BILLING_LOGIN_EMAIL: chintan.e2e.billing@synthetic.test
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4104
      # Money-path spec (billing-upgrade.spec.ts) — synthetic provider
      # config; secrets are e2e-only literals, never real credentials.
      BILLING_ENABLED: 'true'
      PADDLE_WEBHOOK_SECRET: e2e_local_paddle_webhook_secret
      E2E_PADDLE_WEBHOOK_SECRET: e2e_local_paddle_webhook_secret
      BILLING_CATALOG_JSON: '{"paddle":{"pro_monthly":"pri_e2e_pro_monthly"}}'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @declutrmail/e2e exec playwright install --with-deps chromium
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-client
      - name: Apply migrations to the disposable database
        run: |
          for migration in packages/db/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$migration"
          done
      - name: Start the API and web app
        run: |
          PORT=4104 pnpm --filter @declutrmail/api start > api-e2e.log 2>&1 &
          API_PID=$!
          PORT=3104 pnpm --filter @declutrmail/web dev > web-e2e.log 2>&1 &
          WEB_PID=$!

          for attempt in $(seq 1 90); do
            api_ready=false
            web_ready=false
            if curl --silent --output /dev/null http://127.0.0.1:4104/api/not-a-route; then
              api_ready=true
            fi
            if curl --silent --output /dev/null http://127.0.0.1:3104; then
              web_ready=true
            fi
            if [[ "$api_ready" == true && "$web_ready" == true ]]; then
              exit 0
            fi
            if ! kill -0 "$API_PID" || ! kill -0 "$WEB_PID"; then
              sed -n '1,240p' api-e2e.log
              sed -n '1,240p' web-e2e.log
              exit 1
            fi
            sleep 2
          done

          sed -n '1,240p' api-e2e.log
          sed -n '1,240p' web-e2e.log
          exit 1
      - name: Run the authenticated accessibility gate
        run: pnpm e2e:a11y
        env:
          E2E_JSON_REPORT: ${{ github.workspace }}/e2e-a11y-report.json
      - name: Run the billing money-path spec
        # Was runnable-but-never-run: PR #401 changed the Free tier and
        # this spec rotted invisibly (flow audit 2026-07-28). In CI it
        # guards the paywall → signed webhook → entitlement flip chain.
        run: pnpm --filter @declutrmail/e2e run e2e:billing
        env:
          E2E_JSON_REPORT: ${{ github.workspace }}/e2e-billing-report.json
      # Playwright exits 0 when every test skips, so the two steps above
      # can pass having asserted nothing. This is the required check that
      # would go green over it, so coverage is asserted, not assumed.
      - name: Assert both e2e lanes actually ran
        if: always()
        run: |
          node scripts/assert-e2e-ran.mjs e2e-a11y-report.json "accessibility gate"
          node scripts/assert-e2e-ran.mjs e2e-billing-report.json "billing money path"
      - name: Upload accessibility diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: accessibility-diagnostics
          if-no-files-found: ignore
          path: |
            api-e2e.log
            web-e2e.log
            packages/e2e/test-results/
