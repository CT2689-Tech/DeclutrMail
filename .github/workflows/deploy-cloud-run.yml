# Build + push container images, then deploy both Cloud Run services.
#
# Trigger: every push to `main`. Manual via `workflow_dispatch`.
# Cost: GitHub Actions free OSS minutes; Cloud Build is the docker
# builder under the hood (10s of free build-minutes/day).
#
# Image strategy (matches `docs/runbooks/prod-infra-bootstrap.md`):
#   - One image tagged with the commit SHA (immutable) + `latest` (movable)
#   - The `declutrmail-api` service and the `declutrmail-worker-pool`
#     worker pool share the image
#   - `declutrmail-worker-pool` overrides `command`/`args` to switch
#     entrypoint to `src/worker.ts`; `declutrmail-api` uses the default CMD
#   - The legacy `declutrmail-worker` service is kept disabled (manual
#     scaling, 0 instances) as the rollback path — never deleted here
#
# Authentication — Workload Identity Federation (NOT a JSON SA key):
#   - The deploy SA `declutrmail-deploy@declutrmail-ai-prod.iam.gserviceaccount.com`
#     is the GCP principal the workflow impersonates.
#   - The GCP org policy `constraints/iam.disableServiceAccountKeyCreation`
#     blocks long-lived JSON keys (good default). WIF replaces them with
#     short-lived OIDC token exchange — GitHub's OIDC token → GCP STS →
#     SA impersonation. No long-lived secret to leak or rotate.
#   - Two GH secrets carry the wiring (NOT the auth value itself —
#     these are public-ish identifiers, but stored as secrets for hygiene):
#       GCP_WIF_PROVIDER → the full provider resource name
#       GCP_DEPLOY_SA    → the deploy SA email
#   - The deploy SA has `roles/artifactregistry.writer`,
#     `roles/run.developer`, and `roles/iam.serviceAccountUser` on the
#     runtime SA so it can deploy revisions running as the runtime SA.
#   - Repo `CT2689-Tech/DeclutrMail` is bound to impersonate the deploy
#     SA via `principalSet://…/attribute.repository/CT2689-Tech/DeclutrMail`.
#     A WIF provider attribute condition pins this to that one repo, so
#     a different repo's GH OIDC token cannot impersonate.
#
# Why not just push :latest and let Cloud Run pull? Two reasons:
#   1. Cloud Run only redeploys when you tell it to (`gcloud run deploy`).
#      Pushing a tag isn't enough; the workflow MUST also run deploy.
#   2. Pinning the deployed revision to the commit SHA tag (not `:latest`)
#      means a rollback is `gcloud run services update --image=<sha>` —
#      no risk of pulling a freshly-mutated `:latest` from a rolled-back
#      build.
#
# Branch deployment policy: only `main` deploys. Preview deploys (per
# PR / per branch) are intentionally NOT wired here — Cloud Run revisions
# are cheap but managing N stale ones is operational tax. Promote to
# preview deploys once we have a real second environment to point at.
#
# Workflow-injection safety:
#   Per GitHub's hardening guidance, NEVER interpolate `${{ ... }}` from
#   any GitHub-supplied input (issue titles, commit messages, branch
#   names) directly into `run:` script bodies — they can carry shell
#   metacharacters. Instead, route every interpolation through `env:`
#   so the shell receives a normal env var, not a substituted token.
#   Even values that are structurally safe today (e.g. `github.sha` is
#   a 40-char SHA-1 hex string from git itself) follow this pattern so
#   a future swap to an attacker-controllable input doesn't open a hole.

name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    # Skip when only docs / non-runtime files change. Faster CI + fewer
    # spurious deploys. List files Cloud Run cares about.
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.dockerignore'
      - '.github/workflows/deploy-cloud-run.yml'
      - 'scripts/select-deployment.mjs'
      - 'scripts/deploy-api-safely*'
      - 'scripts/check-billing-queue-runtime*'
  workflow_dispatch:
    # Allow manual re-deploys (e.g. after a Secret Manager rotation
    # where the IMAGE hasn't changed but the env needs to be repulled).

env:
  PROJECT: declutrmail-ai-prod
  REGION: us-central1
  # The WORKER's region, deliberately separate from REGION.
  #
  # Measured 2026-08-24: the `getGmailClient` mailbox lookup takes 94 ms
  # of wall clock in the worker against 1.381 ms of server-side execution
  # (19,283 calls, pg_stat_statements). ~93 ms of every round trip is the
  # distance from us-central1 (Iowa) to Supabase in us-west-2 (Oregon),
  # and a user action makes 16-19 trips. us-west1 is Oregon — the same
  # metro as the database.
  #
  # The worker moves first because it has NO domain mapping: there is no
  # DNS record and no managed certificate to reissue, so the move is a
  # stop-then-start with no cutover. The API keeps REGION until that
  # cutover is scheduled, which is the only reason these are two
  # variables instead of one.
  #
  # KMS_KEY_RESOURCE stays pinned to us-central1 (key rings cannot move),
  # so a decrypt becomes cross-region — roughly +40 ms. The ciphertext-
  # keyed unwrap cache added in #625 makes that ~1 call per 10 minutes
  # per mailbox instead of ~975/day, which is why this trade is worth
  # taking rather than a reason to avoid it.
  WORKER_REGION: us-west1
  WORKER_POOL: declutrmail-worker-pool
  # Retired worker service, disabled after each healthy pool deploy and kept
  # for rollback (docs/runbooks/worker-pool-cutover.md).
  LEGACY_WORKER: declutrmail-worker
  REPO: declutrmail
  # Match the verified HTTP API rollout; the worker keeps its existing driver.
  API_DB_DRIVER: node-postgres
  # Approved access/grant notices use the verified private queue preflight.
  # Preserve first enrollment across routine releases and rollback.
  # Tested broker connections returned partial actor lists. Keep activation
  # off until the release gate can prove the complete consumer capability set.
  BILLING_APP_NOTICES_ENABLED: 'false'
  BILLING_APP_NOTICES_START_AT: '2026-10-11T03:15:41.000Z'
  # Runtime SA used by BOTH Cloud Run services. Declared as an env so a
  # future rename touches one place.
  RUNTIME_SA: declutrmail-api@declutrmail-ai-prod.iam.gserviceaccount.com
  # KMS resource path — config string, safe in plaintext.
  KMS_KEY_RESOURCE: projects/declutrmail-ai-prod/locations/us-central1/keyRings/declutrmail/cryptoKeys/oauth-token-kek
  # OAuth client ID — public-facing per `.env.example` (not a secret).
  GOOGLE_CLIENT_ID: 387835380133-34lfqvcgmk5d017dd264tkjmme8as8ml.apps.googleusercontent.com
  # Pub/Sub topic — config string.
  GMAIL_PUBSUB_TOPIC: projects/declutrmail-ai-prod/topics/gmail-push
  PUBSUB_OIDC_SERVICE_ACCOUNT: gmail-webhook-oidc@declutrmail-ai-prod.iam.gserviceaccount.com

# All production releases share one lock, including manual dispatch.
# Snapshot/rollback must never race another release of the same services.
concurrency:
  group: deploy-cloud-run-production
  cancel-in-progress: false

jobs:
  # Deploy must not outrun CI.
  #
  # This workflow and `ci.yml` both trigger on the same push to `main`,
  # so they RACED: on 2026-08-18 #554 shipped to Cloud Run while its own
  # CI run was failing the bundle budget, and the red only surfaced when
  # the next PR inherited it. A size gate shipping is survivable; the
  # same path would have deployed a failing test suite just as happily.
  #
  # `workflow_dispatch` skips the wait on purpose — a manual re-deploy
  # (secret rotation, env repull) must never be blocked behind CI.
  await-ci:
    # Manual dispatch also accepts branch refs; production only accepts main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      deploy: ${{ steps.wait.outputs.deploy }}
    permissions:
      contents: read
      # `gh run list` reads the CI run for this commit.
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Require green CI and skip superseded automatic releases
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deadline=$(( SECONDS + 40 * 60 ))
          while (( SECONDS < deadline )); do
            # Do not spend another build/deploy on an intermediate commit when
            # a newer runtime release has already passed its own full CI.
            # API errors fail closed; active deployments are never cancelled.
            superseded=$(node scripts/select-deployment.mjs)
            if [ "$superseded" = true ]; then
              echo "A newer automatic main release passed CI; skipping this intermediate deployment."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            info=$(gh run list --repo "$REPO" --workflow CI --commit "$SHA" --event push --branch main \
                     --limit 1 --json status,conclusion \
                     --jq '.[0] | "\(.status)|\(.conclusion // "")"' 2>/dev/null || true)
            status=${info%%|*}
            conclusion=${info#*|}
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then
                echo "deploy=true" >> "$GITHUB_OUTPUT"
                echo "CI is green for $SHA — proceeding with the deploy."
                exit 0
              fi
              echo "::error::CI concluded '$conclusion' for $SHA — refusing to deploy."
              exit 1
            fi
            if [ -z "$status" ]; then
              echo "No CI run registered for $SHA yet; waiting…"
            else
              echo "CI is '$status' for $SHA; waiting…"
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for the CI run for $SHA."
          exit 1

  build-and-deploy:
    needs: await-ci
    if: needs.await-ci.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # `id-token: write` lets the workflow exchange GH OIDC for GCP
      # short-lived creds via Workload Identity Federation. We currently
      # use a JSON key (simpler), but keeping the permission so the
      # later switch to WIF is one-line.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to GCP via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v3
        with:
          # WIF — no JSON key. GH OIDC token is exchanged for a
          # short-lived GCP access token tied to the deploy SA.
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify deployment safety contracts
        run: node --test scripts/deploy-api-safely.test.mjs scripts/check-billing-queue-runtime.test.mjs

      - name: Check serving API driver before releasing either service
        run: node scripts/deploy-api-safely.mjs --check-driver="$API_DB_DRIVER" --region="$REGION" --project="$PROJECT"

      - name: Configure docker auth for Artifact Registry
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build + push image (linux/amd64)
        id: build
        # Route `github.sha` through env per workflow-injection guidance
        # (see top-of-file note). `github.sha` is a git-generated SHA-1
        # hex string — structurally safe — but the env-var pattern is
        # the only one that stays safe under future input changes.
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHA_TAG="$REGION-docker.pkg.dev/$PROJECT/$REPO/api:$GITHUB_SHA"
          LATEST_TAG="$REGION-docker.pkg.dev/$PROJECT/$REPO/api:latest"
          # `--platform linux/amd64` is REQUIRED — GH Actions runs on x86
          # already so this is the native build, but stating it explicitly
          # so a future arm runner doesn't silently produce arm-only
          # manifests that Cloud Run rejects.
          docker build --platform linux/amd64 \
            -f apps/api/Dockerfile \
            -t "$SHA_TAG" \
            -t "$LATEST_TAG" \
            .
          docker push "$SHA_TAG"
          docker push "$LATEST_TAG"
          echo "image=$SHA_TAG" >> "$GITHUB_OUTPUT"

      - name: Check email queue actors before new preferences
        id: billing_queue_check
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail
          # Brief preferences require the compatibility release even when
          # billing notices are disabled. The candidate's private probe verifies
          # both actor protocols; old/mixed workers fail before new writes.
          # The existing runtime can read its bound Redis secret; the deploy
          # identity deliberately cannot. Keep values inside a private job.
          # Success requires a terminal proof and verified owned-job cleanup.
          node scripts/check-billing-queue-runtime.mjs

      # WORKER DEPLOYS BEFORE API (swapped 2026-09-03, architecture-guardian
      # review of the RateLimitError backoff fix). Both services share this
      # same image, but a producer/consumer contract change — API starting
      # to enqueue a job option (`backoff: { type: 'custom' }`) only a
      # NEWLY-CODED worker understands — is unsafe consumer-second: any job
      # enqueued in the gap between the two deploys that lands on the OLD
      # worker revision and needs a retry throws inside BullMQ itself
      # (`Unknown backoff strategy custom.`), and that failure is WORSE than
      # a normal one — the job never reaches `failed`, so there is no
      # dead-letter row and no Sentry capture, just a job stuck `active`
      # until the stalled-job reclaim. Deploying the consumer (worker) first
      # closes that window for this change and for any future one shaped
      # the same way. Same class as CLAUDE.md's 2026-08-25 web-ahead-of-API
      # incident — a required key introduced by a producer must exist for
      # every consumer that could receive it before the producer starts
      # sending it.
      #
      # Legacy service → worker pool cutover (docs/runbooks/worker-pool-cutover.md).
      # A worker pool rollout has no stop-before-start guarantee (instance
      # reassignment "is not instantaneous", Cloud Run docs), and the legacy
      # service keeps running until the cutover step below, so two worker
      # processes overlap on every release. `OutboxDispatcherWorker` only
      # claims rows while it holds the Redis lease
      # (`packages/workers/src/outbox-dispatcher-lease.ts`). Every process in
      # the overlap must therefore run lease-aware code: while the legacy
      # service still serves, roll it to this image BEFORE the pool starts.
      # Once the service is disabled this step is a no-op.
      - name: Give the serving legacy worker the outbox lease
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! gcloud run services describe "$LEGACY_WORKER" --region="$WORKER_REGION" \
              --project="$PROJECT" --format=json > legacy-worker.json 2> legacy-worker.err; then
            if grep -qiE 'could not be found|NOT_FOUND' legacy-worker.err; then
              echo "No legacy worker service; nothing to roll."
              exit 0
            fi
            cat legacy-worker.err >&2
            exit 1
          fi
          if jq -e '.metadata.annotations as $a |
              $a["run.googleapis.com/scalingMode"] == "manual" and
              $a["run.googleapis.com/manualInstanceCount"] == "0"' legacy-worker.json > /dev/null; then
            echo "Legacy worker service is disabled (manual scaling, 0 instances); nothing to roll."
            exit 0
          fi
          # Image and release tag only: the template keeps the env, secrets,
          # startup probe and 1/1 instance bounds of its last full deploy.
          gcloud run services update "$LEGACY_WORKER" \
            --image="$IMAGE" \
            --update-env-vars="SENTRY_RELEASE=$GITHUB_SHA" \
            --region="$WORKER_REGION" \
            --project="$PROJECT" \
            --quiet
          # Traffic pinned to an older revision would leave pre-lease code
          # serving beside the pool; the new revision must take all of it.
          gcloud run services describe "$LEGACY_WORKER" --region="$WORKER_REGION" \
            --project="$PROJECT" --format=json | jq -e --arg image "$IMAGE" '
              .status as $s |
              [$s.traffic[]? | select((.percent // 0) > 0)] as $serving |
              .spec.template.spec.containers[0].image == $image and
              $s.latestReadyRevisionName == $s.latestCreatedRevisionName and
              ($serving | length) == 1 and $serving[0].percent == 100 and
              $serving[0].revisionName == $s.latestReadyRevisionName' > /dev/null \
            || { echo "::error::$LEGACY_WORKER is not serving $IMAGE on 100% of traffic"; exit 1; }

      - name: Record serving worker-pool revision
        id: pool_before
        run: |
          set -euo pipefail
          # `list` prints nothing for a missing pool and fails on a permission
          # error, so "no pool yet" is never confused with "could not look".
          EXISTS=$(gcloud run worker-pools list --region="$WORKER_REGION" --project="$PROJECT" \
            --filter="metadata.name=$WORKER_POOL" --format="value(metadata.name)")
          PREVIOUS=""
          PREVIOUS_INSTANCES=""
          if [ -n "$EXISTS" ]; then
            gcloud run worker-pools describe "$WORKER_POOL" \
              --region="$WORKER_REGION" --project="$PROJECT" --format=json > pool-before.json
            PREVIOUS=$(jq -er '
                [.status.instanceSplits[]? | select((.percent // 0) > 0)] |
                if length == 1 and .[0].percent == 100 then .[0].revisionName
                else error("Worker pool must assign 100% to one revision before a deploy") end' pool-before.json)
            # A runbook rollback leaves the pool at 0 instances; a failed
            # deploy must put that back, not just the revision.
            PREVIOUS_INSTANCES=$(jq -er '.metadata.annotations["run.googleapis.com/manualInstanceCount"]
                // error("Worker pool has no manual instance count")' pool-before.json)
          fi
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "previous_instances=$PREVIOUS_INSTANCES" >> "$GITHUB_OUTPUT"
          echo "Worker-pool revision before deploy: ${PREVIOUS:-none (first deploy)} (${PREVIOUS_INSTANCES:-0} instances)"

      - name: Deploy declutrmail-worker-pool (BullMQ + crons)
        id: pool_deploy
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Worker shares the API image — only the entrypoint differs.
          # `--command="node"` + `--args=...` overrides the image CMD.
          #
          # A worker pool has no endpoint and always allocates CPU, which is
          # what the old service's `--no-cpu-throttling` bought (2026-06-08:
          # throttled CPU between job ticks killed gRPC pools to KMS / Gmail /
          # Supabase and BullMQ marked jobs stalled). There are no
          # `--port`, probe, `--cpu-boost` or ingress flags on
          # `worker-pools deploy`, so the in-process health server on 8080
          # is unprobed here; the next step verifies boot from the
          # revision's own logs instead.
          #
          # DEV-PHASE sizing (2026-07-10, founder cost review): 1 CPU + 1Gi.
          # The June invoice's $72/mo was this worker at 2 CPU / 2Gi
          # always-allocated — sized for the launch-scale initial-sync working
          # set with zero users to serve. Initial sync is resumable, so an OOM
          # under 1Gi degrades to a retry, not data loss. REVERT to 2 CPU /
          # 2Gi when real users arrive.
          #
          # `--instances=1` is fixed manual scaling. Raising it is safe for the
          # outbox (the Redis lease admits one dispatcher), but every
          # setInterval cron in `apps/api/src/worker.ts` would run once per
          # instance — check each before scaling out.
          #
          # WORKER_*DRAIN_DELAY/STALLED_INTERVAL — BullMQ idle-poll
          # tuning (2026-06-10 Upstash command-volume audit). DEV-PHASE
          # override 2026-07-15: this single worker process runs 17
          # always-on BullMQ Workers; at 10s user-facing drainDelay their
          # idle re-poll was the dominant Upstash cost and suspended the
          # pre-launch $20 budget with zero real traffic. Slowed to 60s/
          # 300s (user-facing) and 300s/900s (cron) for a ~6× idle-command
          # cut — job pickup is marker-driven, NOT drainDelay-bound, so
          # there is no felt latency (see `workerTuningOptions` in
          # `packages/workers/src/queue.ts`). REVERT toward 10s/60s at
          # launch when real traffic warrants snappier crash recovery.
          #
          # RATE_LIMIT_ENABLED was removed here as dead config, not as a
          # posture change: `worker.ts` never calls NestFactory, so
          # RateLimitModule is never instantiated in this process and the
          # variable was read by nothing.
          # This project's Gmail API console showed a 15,000-unit legacy
          # per-user-minute quota on 2026-09-23. Keep 20% headroom; see
          # docs/ops/sync-infra-setup.md before changing this override.
          gcloud run worker-pools deploy declutrmail-worker-pool \
            --image="$IMAGE" \
            --region="$WORKER_REGION" \
            --project="$PROJECT" \
            --service-account="$RUNTIME_SA" \
            --instances=1 \
            --memory=1Gi \
            --cpu=1 \
            --command="node" \
            --args="src/worker.ts" \
            --set-env-vars="^|^NODE_OPTIONS=--enable-source-maps --import @sentry/node/import --import @swc-node/register/esm-register|NODE_ENV=production|KMS_KEY_RESOURCE=$KMS_KEY_RESOURCE|GOOGLE_CLOUD_PROJECT_ID=$PROJECT|GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID|GMAIL_PUBSUB_TOPIC=$GMAIL_PUBSUB_TOPIC|GMAIL_QUOTA_UNITS_PER_MIN=12000|GMAIL_QUOTA_METRIC=gmail.googleapis.com/default|SENTRY_RELEASE=$GITHUB_SHA|WEB_URL=https://app.declutrmail.com|EMAIL_REPLY_TO=support@declutrmail.com|REASONING_RATE_PER_MIN=400|REASONING_TIMEOUT_MS=12000|WORKER_SENTRY_ENABLED=true|WORKER_DB_POOL_MAX=10|WORKER_LOCK_POOL_MAX=10|WORKER_SWEEP_STATEMENT_TIMEOUT_MS=25000|WORKER_DRAIN_DELAY_SEC=60|WORKER_STALLED_INTERVAL_MS=300000|WORKER_CRON_DRAIN_DELAY_SEC=300|WORKER_CRON_STALLED_INTERVAL_MS=900000|DOMAIN_ICON_WEBSITE_FALLBACK_ENABLED=true|API_URL=https://api.declutrmail.com|PADDLE_ENV=production|BILLING_APP_NOTICES_ENABLED=$BILLING_APP_NOTICES_ENABLED|BILLING_APP_NOTICES_START_AT=$BILLING_APP_NOTICES_START_AT|UNSUB_SEND_ENABLED=true" \
            --update-secrets="ANTHROPIC_API_KEY=anthropic-api-key-prod:latest,SENTRY_DSN=sentry-dsn-api:latest,DATABASE_URL=database-url-prod:latest,REDIS_URL=redis-url-prod:latest,GOOGLE_CLIENT_SECRET=google-oauth-client-secret-prod:latest,JWT_ACCESS_SECRET=jwt-access-secret-prod:latest,JWT_REFRESH_SECRET=jwt-refresh-secret-prod:latest,RESEND_API_KEY=resend-api-key-prod:latest,UNSUBSCRIBE_TOKEN_SECRET=unsubscribe-token-secret-prod:latest,PADDLE_API_KEY=paddle-api-key-prod:latest,RAZORPAY_KEY_ID=razorpay-key-id-prod:latest,RAZORPAY_KEY_SECRET=razorpay-key-secret-prod:latest,BRANDFETCH_API_KEY=brandfetch-api-key-prod:latest" \
            --quiet

      - name: Smoke worker-pool revision
        id: pool_verify
        run: |
          set -euo pipefail
          # Cloud Run: "A successful worker pools deployment doesn't indicate
          # a deployment health check was performed or that the runtime
          # container health was validated." Readiness is necessary, not
          # sufficient; the boot proof is the revision's own log line, which
          # `worker.ts` writes only after every queue consumer and the outbox
          # dispatcher are listening.
          # Status can trail the deploy command briefly, so readiness is polled.
          ready_deadline=$(( SECONDS + 3 * 60 ))
          until REVISION=$(gcloud run worker-pools describe "$WORKER_POOL" \
            --region="$WORKER_REGION" --project="$PROJECT" --format=json | jq -er '
              .status as $s | .metadata.annotations as $a |
              ([$s.instanceSplits[]? | select((.percent // 0) > 0)]) as $serving |
              ([$s.conditions[]? | select(.type == "Ready")][0].status // "") as $ready |
              if $ready != "True" then error("Worker pool is not Ready")
              elif $s.observedGeneration != .metadata.generation then error("Worker pool is still reconciling")
              elif $s.latestReadyRevisionName != $s.latestCreatedRevisionName then error("Latest worker-pool revision is not Ready")
              elif ($serving | length) != 1 or $serving[0].percent != 100 or $serving[0].revisionName != $s.latestReadyRevisionName
                then error("Worker pool must assign 100% to its latest revision")
              elif $a["run.googleapis.com/scalingMode"] != "manual" or $a["run.googleapis.com/manualInstanceCount"] != "1"
                then error("Worker pool must run exactly one manual instance")
              else $s.latestReadyRevisionName end'); do
            if (( SECONDS >= ready_deadline )); then
              echo "::error::$WORKER_POOL did not reach Ready on its latest revision within 3 minutes"
              exit 1
            fi
            sleep 15
          done
          echo "Worker-pool revision $REVISION is Ready with 100% of instances"
          # Needs logging.logEntries.list on the deploy SA (roles/logging.viewer).
          FILTER="resource.type=\"cloud_run_worker_pool\" AND resource.labels.worker_pool_name=\"$WORKER_POOL\" AND resource.labels.revision_name=\"$REVISION\" AND (jsonPayload.kind=\"worker.boot_failed\" OR (jsonPayload.kind=\"worker.listening\" AND jsonPayload.queue=\"outbox-dispatcher\"))"
          deadline=$(( SECONDS + 10 * 60 ))
          while :; do
            if ! ENTRIES=$(gcloud logging read "$FILTER" --project="$PROJECT" \
                --freshness=1h --limit=20 --format=json 2> pool-logs.err); then
              cat pool-logs.err >&2
              echo "::error::Cannot read $WORKER_POOL logs; the deploy SA needs roles/logging.viewer (docs/runbooks/worker-pool-cutover.md)."
              exit 1
            fi
            if jq -e 'any(.[]; .jsonPayload.kind == "worker.boot_failed")' <<< "$ENTRIES" > /dev/null; then
              echo "::error::$REVISION logged worker.boot_failed"
              jq -c '.[] | select(.jsonPayload.kind == "worker.boot_failed") | .jsonPayload' <<< "$ENTRIES" >&2
              exit 1
            fi
            if jq -e 'any(.[]; .jsonPayload.kind == "worker.listening")' <<< "$ENTRIES" > /dev/null; then
              echo "$REVISION finished bootstrap (worker.listening queue=outbox-dispatcher)"
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::$REVISION never logged worker.listening for the outbox dispatcher within 10 minutes"
              exit 1
            fi
            sleep 15
          done

      - name: Verify billing notice worker before API producers
        id: pool_notice
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          NOTICE_REVISION=$(gcloud run worker-pools describe "$WORKER_POOL" \
            --region="$WORKER_REGION" --project="$PROJECT" \
            --format='json(status.instanceSplits)' | jq -er '
              [.status.instanceSplits[]? | select((.percent // 0) > 0)] |
              if length == 1 and .[0].percent == 100 then .[0].revisionName
              else error("Notice worker must have one 100% serving revision") end')
          gcloud run worker-pools revisions describe "$NOTICE_REVISION" \
            --region="$WORKER_REGION" --project="$PROJECT" \
            --format='json(spec.containers[0].env,spec.containers[0].image)' | jq -e \
              --arg enabled "$BILLING_APP_NOTICES_ENABLED" --arg image "$IMAGE" \
              --arg start "$BILLING_APP_NOTICES_START_AT" --arg sha "$GITHUB_SHA" '
              (.spec.containers[0].env | map({key: .name, value: .value}) | from_entries) as $env |
              .spec.containers[0].image == $image and
              $env.BILLING_APP_NOTICES_ENABLED == $enabled and
              $env.BILLING_APP_NOTICES_START_AT == $start and
              $env.SENTRY_RELEASE == $sha and
              ([.spec.containers[0].env[]? |
                select(.name == "BILLING_UPGRADE_REFUND_RESTORE_ENABLED")] |
                all(.value == "false" and (has("valueFrom") | not) and (has("valueSource") | not)))'
          echo "Notice worker serving $NOTICE_REVISION; enrollment $BILLING_APP_NOTICES_START_AT"

      # A worker pool has no startup probe to hold instances on the previous
      # revision, so a revision that never proves it booted is rolled back
      # here. Before the cutover the legacy service is still serving, so a
      # first-deploy failure just disables the new pool. A cancelled run is
      # treated as failed: an unverified revision must not keep serving.
      - name: Restore previous worker-pool revision after failed verification
        if: >-
          (failure() || cancelled()) &&
          (contains(fromJSON('["failure","cancelled"]'), steps.pool_deploy.outcome) ||
          contains(fromJSON('["failure","cancelled"]'), steps.pool_verify.outcome) ||
          contains(fromJSON('["failure","cancelled"]'), steps.pool_notice.outcome))
        env:
          PREVIOUS: ${{ steps.pool_before.outputs.previous }}
          PREVIOUS_INSTANCES: ${{ steps.pool_before.outputs.previous_instances }}
        run: |
          set -euo pipefail
          if [ -n "$PREVIOUS" ]; then
            # Instance count first, so a pool that was stopped never runs
            # the failed revision while the split moves back.
            gcloud run worker-pools update "$WORKER_POOL" --instances="$PREVIOUS_INSTANCES" \
              --region="$WORKER_REGION" --project="$PROJECT" --quiet
            gcloud run worker-pools update-instance-split "$WORKER_POOL" \
              --to-revisions="$PREVIOUS=100" \
              --region="$WORKER_REGION" --project="$PROJECT" --quiet
            echo "::warning::Worker pool restored to $PREVIOUS at $PREVIOUS_INSTANCES instance(s)"
          elif [ -n "$(gcloud run worker-pools list --region="$WORKER_REGION" --project="$PROJECT" \
              --filter="metadata.name=$WORKER_POOL" --format="value(metadata.name)")" ]; then
            gcloud run worker-pools update "$WORKER_POOL" --instances=0 \
              --region="$WORKER_REGION" --project="$PROJECT" --quiet
            echo "::warning::First worker-pool deploy failed; pool disabled, legacy service untouched"
          fi

      # Cutover: only after the pool's revision has proved it booted. Manual
      # scaling to 0 stops every instance without a new revision and without
      # deleting anything; `--scaling=auto` restores the revision's 1/1
      # bounds (rollback in docs/runbooks/worker-pool-cutover.md). Never
      # delete the service here: it is the rollback path.
      - name: Disable legacy worker service after pool is healthy
        run: |
          set -euo pipefail
          disabled='.metadata.annotations as $a |
            $a["run.googleapis.com/scalingMode"] == "manual" and
            $a["run.googleapis.com/manualInstanceCount"] == "0"'
          if ! gcloud run services describe "$LEGACY_WORKER" --region="$WORKER_REGION" \
              --project="$PROJECT" --format=json > legacy-worker.json 2> legacy-worker.err; then
            if grep -qiE 'could not be found|NOT_FOUND' legacy-worker.err; then
              echo "No legacy worker service; nothing to disable."
              exit 0
            fi
            cat legacy-worker.err >&2
            exit 1
          fi
          if jq -e "$disabled" legacy-worker.json > /dev/null; then
            echo "Legacy worker service already disabled."
            exit 0
          fi
          gcloud run services update "$LEGACY_WORKER" --scaling=0 \
            --region="$WORKER_REGION" --project="$PROJECT" --quiet
          gcloud run services describe "$LEGACY_WORKER" --region="$WORKER_REGION" \
            --project="$PROJECT" --format=json | jq -e "$disabled" > /dev/null
          echo "Legacy worker service disabled (manual scaling, 0 instances); kept for rollback."

      - name: Deploy declutrmail-api (HTTP)
        # Same routing-via-env pattern for every interpolation.
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # `--update-secrets` mounts existing Secret Manager secrets as
          # env vars. The runtime SA must hold `roles/secretmanager.
          # secretAccessor` for each (already bound in step 2 of the
          # bootstrap runbook).
          # `--allow-unauthenticated` exposes the service to the public
          # internet — the app does its own session-cookie auth; the
          # Gmail webhook authenticates via Pub/Sub OIDC (D229), not IAM.
          # The webhooks module (PUBSUB_WEBHOOK_ENABLED=true) crashes
          # boot unless BOTH PUBSUB_PUSH_AUDIENCE + PUBSUB_PUSH_SA_EMAIL
          # are set — keep all three together. The audience + SA must
          # match the gmail-push-sub subscription's --push-auth-token-
          # audience + --push-auth-service-account, and the push
          # endpoint must be /api/webhooks/gmail/pubsub (not /gmail).
          #
          # BETA_GATE_ENABLED (private-beta invite gate, buildout F7):
          # the ONLY safe flip is editing this file (false → true in a
          # one-line PR). NEVER flip it live via `--update-env-vars` —
          # `--set-env-vars` below is a FULL REPLACE, so the next
          # routine deploy would silently wipe a live-set value and
          # reopen signup during private beta (the PR #188
          # cloud-run-env-full-replace incident class). The invite list
          # lives in Secret Manager (`beta-invite-emails-prod`) so it
          # rotates without a workflow edit — but the secret binding is
          # NOT yet in --update-secrets below: a referenced secret that
          # doesn't exist fails the whole deploy, and the secret is a
          # founder-created resource. With the gate at `false` the list
          # is unread. Flip sequence (one PR): create the secret per
          # `docs/runbooks/secrets-inventory.md`, add
          # `BETA_INVITE_EMAILS=beta-invite-emails-prod:latest` to
          # --update-secrets, set BETA_GATE_ENABLED=true.
          #
          # BILLING_ENABLED / PADDLE_ENV (D117/D118): production Paddle
          # cutover. The three Paddle runtime secrets now exist in Secret
          # Manager and are API-only bindings (the worker must not receive
          # billing credentials). Razorpay remains intentionally deferred;
          # its secrets are not bound and India checkout stays unavailable.
          # This enables the guarded billing routes for the live catalog;
          # merge/deploy still requires one low-value purchase + refund
          # verification before public announcement.
          #
          # Razorpay went LIVE 2026-07-25 — all three secrets exist and are
          # bound below. The sequence is kept here because it is the order
          # any future provider (or a re-key) has to follow, and because
          # step 1 is the one that silently costs money when skipped:
          #   1. Register the LIVE webhook in the Razorpay dashboard,
          #      BEFORE binding anything. Endpoint (note the /billing
          #      segment —
          #      BillingRazorpayController is @Controller('webhooks/billing')
          #      + @Post('razorpay')):
          #        https://api.declutrmail.com/api/webhooks/billing/razorpay
          #      Subscribe exactly the 9 events the handler consumes:
          #        subscription.activated  subscription.cancelled
          #        subscription.charged    subscription.completed
          #        subscription.halted     subscription.paused
          #        subscription.pending    subscription.resumed
          #        subscription.updated
          #      Entitlements are granted by WEBHOOK ONLY (§10
          #      no-fake-completion) — a successful payment never updates
          #      local state on its own. A missing or misrouted webhook
          #      therefore means money taken and no plan granted. Omitting
          #      `subscription.updated` specifically strands D120 scheduled
          #      downgrades, which clear only on that event.
          #   2. Founder creates all three secrets (see
          #      docs/runbooks/secrets-inventory.md):
          #      razorpay-key-id-prod, razorpay-key-secret-prod,
          #      razorpay-webhook-secret-prod — the last one is the signing
          #      secret entered in step 1, byte-identical.
          #   3. ONE PR appends to --update-secrets below:
          #      RAZORPAY_KEY_ID=razorpay-key-id-prod:latest,
          #      RAZORPAY_KEY_SECRET=razorpay-key-secret-prod:latest,
          #      RAZORPAY_WEBHOOK_SECRET=razorpay-webhook-secret-prod:latest
          #   4. Provision the Razorpay catalog + patch the manifest's
          #      razorpayPlanId values — that is what actually opens India.
          # Add all three together: an API holding a Razorpay key but no
          # webhook secret would accept checkouts and then fail every
          # signature verification (money taken, entitlement never
          # granted). Keeping the list STATIC also preserves preflight's
          # "live revision matches the deploy secret contract" drift check,
          # which needs a declarative contract to compare against.
          #
          # Resend (D162) is bound below, per-service and least-privilege:
          # RESEND_API_KEY on the WORKER only (it is the sender —
          # EmailService sits behind the worker's EmailDeliveryPort, and no
          # API request path calls .send()); RESEND_WEBHOOK_SECRET on the
          # API only (it verifies inbound svix signatures; the worker
          # serves no HTTP). Neither service holds the other's credential.
          # UNSUBSCRIBE_TOKEN_SECRET (D165) is the one Resend-adjacent
          # secret on BOTH services by necessity: the worker SIGNS the
          # RFC 8058 token at enqueue time and the API VERIFIES it when
          # Gmail POSTs the one-click unsubscribe.
          # Both services currently run as the SAME service account, so
          # that split is a convention, not an IAM boundary — see
          # FOUNDER-FOLLOWUPS.md.
          #
          # D193 launch floor: keep one API instance warm so OAuth callbacks
          # and authenticated requests do not cold-start during launch.
          #
          # RATE_LIMIT_ENABLED is deliberately ABSENT (D156). Do not re-add
          # it: the name suggests it toggles enforcement, but production
          # ignores it for that purpose — RateLimitModule guards the disable
          # branch with `&& !isProd`, so with REDIS_URL bound (it is, below)
          # the limiter runs either way. Its only live effect in production
          # was to disarm the fail-closed boot guard, which refuses to start
          # an unlimited API when REDIS_URL is missing. Setting it traded a
          # loud boot failure for a silent fail-open.
          # `--no-cpu-throttling` + `--cpu-boost`. The SAME failure the
          # worker hit on 2026-06-08, on the service where it is far more
          # visible — and it was fixed there and never here.
          #
          # Under request-only CPU the API is frozen between requests, so
          # the postgres.js pool to Supabase (us-west-2, a DIFFERENT region
          # from this service) dies while idle and every request pays a
          # fresh TCP + TLS + auth handshake. TLS is CPU work, so on one
          # throttled core the concurrent handshakes queue rather than
          # overlap, and the endpoint opening the most connections pays the
          # most.
          #
          # Measured from a production HAR (US user, own account,
          # 2026-08-21). Same instance, same region, same code path — the
          # only variable is whether the request reached the database:
          #   401s, rejected by JwtGuard before any query ...  88-119ms
          #   /api/auth/refresh ..............................    676ms
          #   /api/senders/summary ...........................    790ms
          #   /api/undo, /api/auth/me ........................ 938, 954ms
          #   /api/v1/sync/status, /api/snoozed/recovery ..... 1135, 1145ms
          #   /api/senders (most connections of any endpoint) . 11,180ms
          # `/api/auth/me` is one user lookup. 954ms is not query time.
          #
          # That 11.2s also blows the 2000ms server-hydration deadline in
          # `apps/web/src/lib/server-query-client.ts`, so the SSR prefetch
          # is CANCELLED and the browser refetches from scratch: ~19s to a
          # usable Senders screen, onLoad at 6.2s.
          #
          # COST, from the project's own bill rather than a price list:
          # `declutrmail-worker` runs this exact config at 1 vCPU / 1Gi and
          # serves ZERO requests, so its $50.51/mo is almost entirely the
          # always-on charge. This service at half the memory lands a little
          # under that, replacing today's $10.93 — about +$37/mo. Founder
          # ratified 2026-08-21 after seeing both figures.
          # HTTP-only candidate: consumers remain on the ordinary worker rollout.
          # The helper smokes a tagged revision before promotion and restores
          # the previous resolved traffic assignment if promotion/smoke fails.
          node scripts/deploy-api-safely.mjs gcloud run deploy declutrmail-api \
            --image="$IMAGE" \
            --region="$REGION" \
            --project="$PROJECT" \
            --service-account="$RUNTIME_SA" \
            --min-instances=1 \
            --max-instances=3 \
            --memory=512Mi \
            --cpu=1 \
            --cpu-boost \
            --no-cpu-throttling \
            --port=8080 \
            --allow-unauthenticated \
            --startup-probe="httpGet.path=/api/healthz,httpGet.port=8080,periodSeconds=10,timeoutSeconds=5,failureThreshold=24" \
            --liveness-probe="httpGet.path=/api/healthz,httpGet.port=8080,periodSeconds=30,timeoutSeconds=5,failureThreshold=3" \
            --set-env-vars="NODE_ENV=production,API_DB_DRIVER=$API_DB_DRIVER,API_DB_POOL_MAX=10,HTTP_PERFORMANCE_SAMPLE_RATE=0.1,WEB_URL=https://app.declutrmail.com,GOOGLE_REDIRECT_URI=https://api.declutrmail.com/api/auth/google/callback,CORS_ORIGIN=/^https:[/][/](app[.])?declutrmail[.]com$/,COOKIE_DOMAIN=.declutrmail.com,KMS_KEY_RESOURCE=$KMS_KEY_RESOURCE,GOOGLE_CLOUD_PROJECT_ID=$PROJECT,GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID,GMAIL_PUBSUB_TOPIC=$GMAIL_PUBSUB_TOPIC,PUBSUB_OIDC_SERVICE_ACCOUNT=$PUBSUB_OIDC_SERVICE_ACCOUNT,PUBSUB_WEBHOOK_ENABLED=true,PUBSUB_PUSH_AUDIENCE=https://api.declutrmail.com,PUBSUB_PUSH_SA_EMAIL=$PUBSUB_OIDC_SERVICE_ACCOUNT,SENTRY_RELEASE=$GITHUB_SHA,BETA_GATE_ENABLED=false,BILLING_ENABLED=true,PADDLE_ENV=production,BILLING_APP_NOTICES_ENABLED=$BILLING_APP_NOTICES_ENABLED,BILLING_APP_NOTICES_START_AT=$BILLING_APP_NOTICES_START_AT,UNSUB_SEND_ENABLED=true" \
            --update-secrets="ANTHROPIC_API_KEY=anthropic-api-key-prod:latest,SENTRY_DSN=sentry-dsn-api:latest,GOOGLE_CLIENT_SECRET=google-oauth-client-secret-prod:latest,JWT_ACCESS_SECRET=jwt-access-secret-prod:latest,JWT_REFRESH_SECRET=jwt-refresh-secret-prod:latest,DATABASE_URL=database-url-prod:latest,REDIS_URL=redis-url-prod:latest,ADMIN_EMAIL_ALLOWLIST=admin-email-allowlist-prod:latest,RESEND_WEBHOOK_SECRET=resend-webhook-secret-prod:latest,PADDLE_API_KEY=paddle-api-key-prod:latest,PADDLE_CLIENT_TOKEN=paddle-client-token-prod:latest,PADDLE_WEBHOOK_SECRET=paddle-webhook-secret-prod:latest,RAZORPAY_KEY_ID=razorpay-key-id-prod:latest,RAZORPAY_KEY_SECRET=razorpay-key-secret-prod:latest,RAZORPAY_WEBHOOK_SECRET=razorpay-webhook-secret-prod:latest,UNSUBSCRIBE_TOKEN_SECRET=unsubscribe-token-secret-prod:latest" \
            --quiet

      - name: Verify billing notice API producers
        run: |
          set -euo pipefail
          NOTICE_REVISION=$(gcloud run services describe declutrmail-api \
            --region="$REGION" --project="$PROJECT" \
            --format='json(status.traffic)' | jq -er '
              .status.traffic | map(select((.percent // 0) > 0)) |
              if length == 1 and .[0].percent == 100 then .[0].revisionName
              else error("Notice API must have one 100% serving revision") end')
          gcloud run revisions describe "$NOTICE_REVISION" \
            --region="$REGION" --project="$PROJECT" \
            --format='json(spec.containers[0].env)' | jq -e \
              --arg enabled "$BILLING_APP_NOTICES_ENABLED" \
              --arg start "$BILLING_APP_NOTICES_START_AT" --arg sha "$GITHUB_SHA" '
              (.spec.containers[0].env | map({key: .name, value: .value}) | from_entries) as $env |
              $env.BILLING_APP_NOTICES_ENABLED == $enabled and
              $env.BILLING_APP_NOTICES_START_AT == $start and
              $env.SENTRY_RELEASE == $sha and
              ([.spec.containers[0].env[]? |
                select(.name == "BILLING_UPGRADE_REFUND_RESTORE_ENABLED")] |
                all(.value == "false" and (has("valueFrom") | not) and (has("valueSource") | not)))'
          echo "Notice API serving $NOTICE_REVISION; enrollment $BILLING_APP_NOTICES_START_AT"

      - name: Recover owned billing probe after failed or cancelled release
        if: always() && steps.billing_queue_check.outputs.owned_probe == 'true'
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          BILLING_NOTICE_PROBE_OWNED: ${{ steps.billing_queue_check.outputs.owned_probe }}
        run: node scripts/check-billing-queue-runtime.mjs --cleanup

      - name: Protect serving images from registry cleanup
        if: always() && steps.build.outcome == 'success'
        run: node scripts/pin-production-images.mjs
