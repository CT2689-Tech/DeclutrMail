name: Rehearse upgrade refunds in isolated Paddle sandbox

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: billing-upgrade-refund-sandbox
  cancel-in-progress: false

jobs:
  rehearse:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: Sandbox
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: refund_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d refund_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Migrate the disposable fixture database
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/refund_fixture
        run: |
          for migration in packages/db/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$migration"
          done
      - name: Boundary verification
        run: pnpm --filter @declutrmail/api test src/billing/__tests__/sandbox-rehearsal-boundary.spec.ts
      - name: Start isolated synthetic UI and signed webhook receiver
        env:
          BILLING_REHEARSAL: sandbox
          PADDLE_ENV: sandbox
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
          REHEARSAL_OPERATOR_KEY: ${{ secrets.BILLING_REHEARSAL_OPERATOR_KEY }}
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/refund_fixture
          REHEARSAL_REPORT_PATH: ${{ runner.temp }}/upgrade-refund-rehearsal.json
        run: |
          curl --fail --location --silent --show-error https://github.com/cloudflare/cloudflared/releases/download/2026.10.0/cloudflared-linux-amd64 -o "$RUNNER_TEMP/cloudflared"
          echo 'd33ff2d14475178d2012c2c56beba87389ac5ded27649519f198a7d3134a99db  '"$RUNNER_TEMP/cloudflared" | sha256sum --check --strict
          chmod 700 "$RUNNER_TEMP/cloudflared"
          env -u PADDLE_API_KEY -u REHEARSAL_OPERATOR_KEY -u DATABASE_URL "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate --url http://127.0.0.1:4045 > "$RUNNER_TEMP/tunnel.log" 2>&1 &
          tunnel_pid=$!
          trap 'kill "$tunnel_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            fixture_url=$(sed -nE 's/.*(https:\/\/[a-z0-9-]+\.trycloudflare\.com).*/\1/p' "$RUNNER_TEMP/tunnel.log" | head -1)
            if [ -n "$fixture_url" ]; then break; fi
            sleep 1
          done
          if [ -z "$fixture_url" ]; then exit 1; fi
          export REHEARSAL_PUBLIC_URL="$fixture_url"
          pnpm --filter @declutrmail/api exec node --import @swc-node/register/esm-register scripts/billing-upgrade-refund-rehearsal.ts
      - name: Retain only sanitized proof and cleanup outcomes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upgrade-refund-rehearsal
          path: ${{ runner.temp }}/upgrade-refund-rehearsal.json
          retention-days: 1
          if-no-files-found: error
