# Temporary task branch only; never merge over the normal snapshot workflow.
name: Billing queue access diagnosis
on:
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
concurrency:
  group: billing-queue-access-diagnosis
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.ref == 'refs/heads/codex/billing-queue-access-diagnosis'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PROJECT: declutrmail-ai-prod
      WORKER_REGION: us-west1
      RUNTIME_SA: declutrmail-api@declutrmail-ai-prod.iam.gserviceaccount.com
      IMAGE: us-central1-docker.pkg.dev/declutrmail-ai-prod/declutrmail/api:2faa44067bfd806d99783441c1bef7d154b4b66f
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Verify bounded diagnostic and ownership controls
        run: node --test scripts/diagnose-billing-queue-runtime.test.mjs scripts/check-billing-queue-runtime.test.mjs
      - name: Authenticate using existing Workload Identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Diagnose the exact private probe without service deployment
        id: probe
        run: node scripts/diagnose-billing-queue-runtime.mjs
      - name: Recover only the owned probe
        if: always() && steps.probe.outputs.owned_probe == 'true'
        env:
          BILLING_NOTICE_PROBE_OWNED: ${{ steps.probe.outputs.owned_probe }}
        run: node scripts/check-billing-queue-runtime.mjs --cleanup
