# D162 — real-send smoke for the transactional-email pipeline.
#
# Manual-only (workflow_dispatch). Sends ONE sync-complete email to the
# founder via the production template + From constant, using the
# RESEND_API_KEY repo secret (the key never exists on dev machines).
# The orchestrator triggers this once post-merge; the founder verifies
# receipt + rendering in a real inbox.
#
# One-click unsubscribe (D165): with the UNSUBSCRIBE_TOKEN_SECRET repo
# secret set (same value as `unsubscribe-token-secret-prod` in Secret
# Manager), the smoke email carries the RFC 8058 headers so Gmail's
# native Unsubscribe control is verifiable end-to-end. Pass the
# founder's prod user id as the `unsubscribe_user_id` input for a full
# click→preference-flip check; leave it blank and the click no-ops on a
# placeholder id (control render + endpoint reachability still proven).
#
# Injection posture: no github.event.* interpolation anywhere; secrets
# and the dispatch input reach the script via env only.
name: Email smoke (Resend)

on:
  workflow_dispatch:
    inputs:
      unsubscribe_user_id:
        description: 'Prod users.id to sign into the unsubscribe token (optional)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  send:
    name: Send one sync-complete email
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Send smoke email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UNSUBSCRIBE_TOKEN_SECRET: ${{ secrets.UNSUBSCRIBE_TOKEN_SECRET }}
          SMOKE_UNSUBSCRIBE_USER_ID: ${{ inputs.unsubscribe_user_id }}
        run: pnpm --filter @declutrmail/api email-smoke
