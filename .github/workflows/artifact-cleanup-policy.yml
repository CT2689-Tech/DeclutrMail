# Preview and install the Artifact Registry cleanup policy for the `api` image.
#
# Policy changes are manual only. See docs/ops/cost-efficiency.md for the rollout:
#   1. mode=dry-run  — pins serving/rollback images, prints repo size and what the
#                      policy would delete now, installs the policy with --dry-run.
#   2. Wait about a day, run mode=report and compare with the provider verdict step.
#   3. mode=live + confirm_live=delete-unprotected-api-images — installs with
#      --no-dry-run. Deletion then happens in Artifact Registry's background job.
#
# The schedule only re-pins serving tags, so a rollback done outside the deploy
# workflow (console or gcloud traffic change) is protected within three hours.
#
# Installing needs `artifactregistry.repositories.update`, which the deploy SA's
# `roles/artifactregistry.writer` does not include. Report mode needs only the
# writer role (tag moves use artifactregistry.tags.update; nothing is deleted).
name: Artifact Registry cleanup policy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run installs without deleting; report changes no policy; live enables deletion'
        type: choice
        options: [dry-run, report, live]
        default: dry-run
      confirm_live:
        description: 'live only: type delete-unprotected-api-images'
        type: string
        required: false
        default: ''
  schedule:
    - cron: '23 */3 * * *'

permissions:
  contents: read
  id-token: write

# Not the release lock: a pending run there would replace a queued deploy. Tag moves are
# idempotent and read back, so a race with a deploy's own pin fails loudly, never silently.
concurrency:
  group: artifact-cleanup-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  repin:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Re-pin serving and rollback images
        run: node scripts/pin-production-images.mjs

  cleanup-policy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Validate policy and retention contracts
        run: node --test scripts/artifact-cleanup-policy.test.mjs scripts/pin-production-images.test.mjs
      - name: Refuse unconfirmed live deletion
        if: inputs.mode == 'live'
        env:
          CONFIRM: ${{ inputs.confirm_live }}
        run: |
          if [ "$CONFIRM" != delete-unprotected-api-images ]; then
            echo "::error::Live deletion requires confirm_live=delete-unprotected-api-images"
            exit 1
          fi
      - name: Authenticate to GCP via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Pin serving images, report, and install
        env:
          MODE: ${{ inputs.mode }}
          CLEANUP_CONFIRM: ${{ inputs.confirm_live }}
        run: node scripts/artifact-cleanup-policy.mjs --mode="$MODE"
      - name: Artifact Registry's own dry-run verdict (last 3 days)
        if: always() && steps.auth.outcome == 'success'
        run: node scripts/artifact-cleanup-policy.mjs --mode=verdict
