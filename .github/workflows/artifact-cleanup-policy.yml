# Preview and install the Artifact Registry cleanup policy for the `api` image.
#
# Manual only. See docs/ops/cost-efficiency.md for the rollout:
#   1. mode=dry-run  — pins serving/rollback images, prints repo size and what the
#                      policy would delete now, installs the policy with --dry-run.
#   2. Wait about a day, run mode=report and compare with the provider verdict step.
#   3. mode=live + confirm_live=delete-unprotected-api-images — installs with
#      --no-dry-run. Deletion then happens in Artifact Registry's background job.
#
# Installing needs `artifactregistry.repositories.update`, which the deploy SA's
# `roles/artifactregistry.writer` does not include. Report mode needs only the
# writer role (tag moves use artifactregistry.tags.update; nothing is deleted).
name: Artifact Registry cleanup policy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run installs without deleting; report changes no policy; live enables deletion'
        type: choice
        options: [dry-run, report, live]
        default: dry-run
      confirm_live:
        description: 'live only: type delete-unprotected-api-images'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

# Same lock as releases: this moves the serving tags the deploy also moves.
concurrency:
  group: deploy-cloud-run-production
  cancel-in-progress: false

jobs:
  cleanup-policy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Validate policy and retention contracts
        run: node --test scripts/artifact-cleanup-policy.test.mjs scripts/pin-production-images.test.mjs
      - name: Refuse unconfirmed live deletion
        if: inputs.mode == 'live'
        env:
          CONFIRM: ${{ inputs.confirm_live }}
        run: |
          if [ "$CONFIRM" != delete-unprotected-api-images ]; then
            echo "::error::Live deletion requires confirm_live=delete-unprotected-api-images"
            exit 1
          fi
      - name: Authenticate to GCP via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Pin serving images, report, and install
        env:
          MODE: ${{ inputs.mode }}
          CLEANUP_CONFIRM: ${{ inputs.confirm_live }}
        run: node scripts/artifact-cleanup-policy.mjs --mode="$MODE"
      - name: Artifact Registry's own dry-run verdict (last 3 days)
        if: always() && steps.auth.outcome == 'success'
        run: |
          set -uo pipefail
          filter='protoPayload.serviceName="artifactregistry.googleapis.com" AND protoPayload.request.parent="projects/declutrmail-ai-prod/locations/us-central1/repositories/declutrmail/packages/-" AND protoPayload.request.validateOnly=true'
          if ! out=$(gcloud logging read "$filter" --project=declutrmail-ai-prod \
              --resource-names=projects/declutrmail-ai-prod --freshness=3d --format=json 2>&1); then
            echo "UNVERIFIED: cannot read Data Access audit logs (needs roles/logging.privateLogViewer)."
            echo "$out" | tail -n 3
            exit 0
          fi
          echo "$out" | node --input-type=module -e '
            let s = ""; for await (const c of process.stdin) s += c;
            const names = [...new Set(JSON.parse(s).flatMap((e) => e.protoPayload?.request?.names ?? []))];
            if (!names.length) {
              console.log("UNVERIFIED: no provider dry-run verdict in the last 3 days. Either the background job has not run since install (about a day) or DATA_WRITE audit logs are off for artifactregistry.googleapis.com.");
            } else {
              console.log(`Provider dry run would delete ${names.length} version(s):`);
              for (const n of names) console.log(`  ${n.split("/versions/").pop()}`);
            }'
